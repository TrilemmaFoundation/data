name: Validate datasets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate-datasets:
    name: Validate dataset YAML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate datasets offline
        if: github.event_name == 'pull_request'
        run: npm run validate-datasets:offline

      - name: Check generated notebooks
        if: github.event_name == 'pull_request'
        run: npm run generate-notebooks:check

      - name: Validate live source page identity
        if: github.event_name != 'pull_request'
        run: npm run validate-datasets

      - name: Validate provider contracts
        if: github.event_name != 'pull_request'
        run: npm run validate-providers

      - name: Run allowlisted runtime canaries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set +e
          pip_output="$(python3 -m pip install --quiet pandas requests numpy 2>&1)"
          pip_status=$?
          if [ "$pip_status" -ne 0 ]; then
            printf '%s\n' "$pip_output"
            {
              echo "PYTHON_CANARY_FAILURES<<EOF"
              echo "pip-install: python packages failed to install"
              echo "EOF"
            } >> "$GITHUB_ENV"
            exit "$pip_status"
          fi
          output="$(npm run validate-python-runtime 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            {
              echo "PYTHON_CANARY_FAILURES<<EOF"
              printf '%s\n' "$output"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi
          exit "$status"

      - name: Generate maintenance report
        if: github.event_name != 'pull_request'
        run: npm run maintenance-report

      - name: Upload maintenance report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-report
          path: reports/maintenance-report.*

  test:
    name: Unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated notebooks
        run: npm run generate-notebooks:check

      - name: Run lint
        run: npm run lint

      - name: Enforce 100% core coverage
        run: npm run test:coverage

  build:
    name: Build static site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
