getting_started:
  overview: >
    ECHO Drinking Water System Search services expose SDWIS/Fed inventory and
    compliance attributes for public water systems. Start with one state and
    JSON output. Do not use the web service as a bulk-download substitute, and
    do not treat these records as real-time water-quality measurements.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the ECHO web-services page and locate Drinking Water System Search.
    - Query get_systems for one state with JSON output.
    - Keep the request bounded to that state rather than paging a national extract.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://echodata.epa.gov/echo/sdw_rest_services.get_systems",
          params={"output": "JSON", "p_st": "RI", "p_act": "Y"},
          timeout=30,
      )
      response.raise_for_status()
      payload = response.json()
      systems = pd.json_normalize(payload.get("Results", payload).get("Systems", payload))
      systems["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(systems.head(20))
  first_project:
    title: Profile Active Public Water Systems in One State
    goal: Count active Rhode Island public water systems in a bounded ECHO search and note compliance fields that are present.
    steps:
      - Confirm the JSON response includes water-system identifiers for the selected state.
      - Summarize system counts by county or type without requesting a national download.
      - State that ECHO web services are not a bulk-download path and that SDWIS/Fed is not a real-time water-quality feed.
