getting_started:
  overview: >
    Polymarket's public Gamma API exposes current market metadata without an API
    key. Start with a bounded page of active markets and save when the response
    was retrieved. Treat prices as changing market signals, not guaranteed or
    independently calibrated probabilities.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the official market-data overview and provider terms before using the API.
    - Request a bounded page of active markets from the public Gamma API.
    - Attach a retrieval timestamp to the response before comparing markets.
  python:
    packages:
      - pandas
      - requests
    code: |
      from datetime import datetime, timezone
      import pandas as pd
      import requests

      url = "https://gamma-api.polymarket.com/markets"
      response = requests.get(
          url,
          params={"active": "true", "closed": "false", "limit": 100},
          timeout=30,
      )
      response.raise_for_status()
      markets = pd.json_normalize(response.json())
      markets["retrieved_at"] = datetime.now(timezone.utc)
      print(markets[["question", "volume", "liquidity"]].head())
  first_project:
    title: Compare Liquidity across Active Markets
    goal: Identify which active questions have the deepest markets and test whether liquidity and volume tell the same story.
    steps:
      - Convert volume and liquidity fields to numeric values and inspect missing data.
      - Rank markets by liquidity and compare that ranking with trading volume.
      - Explain why price, liquidity, trading volume, and forecast quality are different concepts.
