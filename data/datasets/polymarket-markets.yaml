getting_started:
  overview: >
    Polymarket's public Gamma API exposes live market metadata without an API
    key. Start with a bounded page of active markets and treat prices as market
    signals rather than guaranteed probabilities.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the official market-data overview and provider terms.
    - Request a small page of active markets from the public Gamma API.
    - Cache the response with a retrieval timestamp before analyzing it.
  python:
    packages:
      - pandas
      - requests
    code: |
      from datetime import datetime, timezone
      import pandas as pd
      import requests

      url = "https://gamma-api.polymarket.com/markets"
      response = requests.get(
          url,
          params={"active": "true", "closed": "false", "limit": 100},
          timeout=30,
      )
      response.raise_for_status()
      markets = pd.json_normalize(response.json())
      markets["retrieved_at"] = datetime.now(timezone.utc)
      print(markets[["question", "volume", "liquidity"]].head())
  first_project:
    title: Compare active market liquidity
    goal: Find which active questions attract the deepest and most active markets.
    steps:
      - Convert volume and liquidity fields to numeric values and inspect missing data.
      - Rank markets by liquidity and compare that ranking with trading volume.
      - Explain why market price, liquidity, and forecast quality are different concepts.
