getting_started:
  overview: >
    The openFDA device-event API searches MAUDE reports and can return
    server-side counts. Start with one device generic name and a bounded
    receive-date window. Voluntary reports cannot establish causality,
    incidence, or comparative device safety.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the device-event field documentation and choose one generic device name.
    - Query a bounded receive-date period and count reported product problems.
    - Preserve the exact query and retrieval timestamp.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.fda.gov/device/event.json",
          params={
              "search": 'device.generic_name:"INFUSION PUMP" AND date_received:[20250101 TO 20251231]',
              "count": "product_problems.exact",
          },
          timeout=30,
      )
      response.raise_for_status()
      problems = pd.DataFrame(response.json()["results"])
      problems["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(problems.head(20))
  first_project:
    title: Summarize reported infusion-pump problems
    goal: Identify the most frequently reported product-problem terms for one device type in a bounded year.
    steps:
      - Confirm the API returned product-problem counts for the generic-name query.
      - Rank the bounded counts and note terms that may reflect duplicate or incomplete reports.
      - State that MAUDE reports do not establish causality, incidence, or comparative device safety.
