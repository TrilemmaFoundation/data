getting_started:
  overview: >
    HouseHunter pins EPA's version 2.1 GeoPackage and matching 2020 Census block
    allocation table from the EPA model's version history. Read only a few
    allocation rows with an HTTP byte range. Version 3 is now current, so do
    not silently mix it with the pinned version 2.1 or interpret modeled
    boundaries as exact household service.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the EPA service-area documentation and public-domain notice.
    - Fetch the beginning of the exact version 2.1 block allocation CSV.
    - Keep the version 2.1 GeoPackage and block table together for full analysis.
  python:
    packages: [requests]
    code: |
      import csv
      import io
      import requests

      url = ("https://media.githubusercontent.com/media/USEPA/ORD_SAB_Model/"
             "main/Version_History/2_1/Census_Tables/Blocks_V_2_1.csv")
      response = requests.get(url, headers={"Range": "bytes=0-8191"}, timeout=30)
      response.raise_for_status()
      assert response.status_code == 206, "Server did not honor bounded byte range"
      rows = csv.DictReader(io.StringIO(response.content.decode("utf-8", errors="ignore")))
      for row in list(rows)[:3]:
          print(row["GEOID20"], row["PWSID"], row["Pop20_AW"])
  first_project:
    title: Inspect One Water Service Allocation
    goal: Identify the population allocation attached to a water system and census block.
    steps:
      - Read a few pinned version 2.1 block rows and retain their PWSIDs.
      - Compare the matching boundary provenance before using the allocation.
      - Explain why modeled service areas do not establish an exact household provider.
