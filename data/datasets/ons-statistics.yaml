getting_started:
  overview: >
    The ONS API returns dataset metadata and observations. Start with one
    edition of CPIH or a labour dataset and a few observations. UK statistics
    have geography codes that do not match U.S. FIPS, and some tables are
    still Excel-only.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the ONS developer hub and pick one dataset id.
    - Request the latest edition metadata, then a small observation slice.
    - Cite ONS under the Open Government Licence.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.beta.ons.gov.uk/v1/datasets/cpih01/editions/time-series/versions/1/observations",
          params={"time": "latest", "geography": "K02000001"},
          timeout=30,
      )
      response.raise_for_status()
      observations = pd.json_normalize(response.json().get("observations", []))
      observations["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(observations.head())
  first_project:
    title: Read a UK CPIH observation
    goal: Test whether the ONS API can power a bounded UK prices card.
    steps:
      - Confirm an observation value returned for the selected dataset and geography.
      - Record the edition version and observation time used.
      - Cite ONS under OGL and explain that UK geography codes are not U.S. FIPS and that editions are versioned.
