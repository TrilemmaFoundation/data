getting_started:
  overview: >
    The Transparency Platform REST API returns XML for load, generation, and
    prices. Start with one bidding zone and one day of actual total load. Zone
    codes change over time, and this is not a retail bill.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free Transparency Platform token saved in the ENTSOE_API_KEY environment variable
  access_steps:
    - Register on the Transparency Platform and create a REST API token.
    - Save the token in ENTSOE_API_KEY.
    - Request one day of actual total load for one bidding zone.
  python:
    packages:
      - pandas
      - requests
      - lxml
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://web-api.tp.entsoe.eu/api",
          params={
              "securityToken": os.environ["ENTSOE_API_KEY"],
              "documentType": "A65",
              "processType": "A16",
              "outBiddingZone_Domain": "10Y1001A1001A83F",
              "periodStart": "202407010000",
              "periodEnd": "202407020000",
          },
          timeout=60,
      )
      response.raise_for_status()
      print(response.text[:1000])
      points = pd.read_xml(response.content, xpath=".//Point")
      print(points.head())
  first_project:
    title: Chart one day of German load
    goal: Test whether a Transparency extract can power a bounded grid-load monitor.
    steps:
      - Parse Point positions and quantities from the XML document.
      - Plot load over the requested day and note missing intervals.
      - Explain that bidding-zone codes change and that platform load is not a household electricity price.
