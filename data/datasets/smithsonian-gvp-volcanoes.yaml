getting_started:
  overview: >
    GVP publishes a Holocene volcano list with coordinates, country, and
    primary volcano type. Start with one country. Presence in the Holocene
    list is not an eruption nowcast, and eruption records are compiled from
    heterogeneous historical sources.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the GVP website and locate the volcano list download or web service.
    - Retrieve Holocene volcanoes and keep volcano number, name, country, and coordinates.
    - Cite Smithsonian GVP when presenting a map or list.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://volcano.si.edu/geoserver/GVP-VOTW/ows",
          params={
              "service": "WFS",
              "version": "1.0.0",
              "request": "GetFeature",
              "typeName": "GVP-VOTW:Smithsonian_VOTW_Holocene_Volcanoes",
              "outputFormat": "application/json",
              "CQL_FILTER": "Country='Iceland'",
          },
          timeout=60,
      )
      response.raise_for_status()
      volcanoes = pd.json_normalize(response.json()["features"])
      print(volcanoes.head())
  first_project:
    title: Map Iceland's Holocene volcanoes
    goal: Test whether GVP coordinates can power a bounded volcanic-place lookup.
    steps:
      - Keep volcano name, volcano number, and coordinates from the Iceland extract.
      - Plot the points and list names missing coordinates.
      - Explain that the Holocene catalog is not a live eruption feed and that historical eruption dates vary in quality.
