getting_started:
  overview: >
    Envirofacts exposes TRI facility tables through a REST URL. Start with one
    state and the first twenty facility rows. Reported pounds are self-reported
    waste-management quantities, not measured community exposure, and they are
    distinct from ECHO drinking-water compliance records.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the Envirofacts Data Service API page and identify the TRI facility table.
    - Request a bounded row window for one state in JSON.
    - Keep facility identifiers, city, and coordinates before joining release quantities.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://data.epa.gov/dmapservice/tri.tri_facility/state_abbr/equals/RI/1:20/json",
          timeout=30,
      )
      response.raise_for_status()
      facilities = pd.DataFrame(response.json())
      facilities["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(facilities.head())
  first_project:
    title: Map reporting TRI facilities in one state
    goal: Test whether a short facility extract can support a local fenceline directory.
    steps:
      - Keep facility name, city, ZIP, and coordinates and drop closed sites when a closure flag is present.
      - Count facilities by city and flag missing coordinates.
      - Explain that TRI pounds are not exposure estimates and that thresholds exclude many smaller operations.
