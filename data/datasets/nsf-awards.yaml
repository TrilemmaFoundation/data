getting_started:
  overview: >
    The NSF Awards API searches Research.gov award records by keyword. Start
    with one term and a 25-record page. Award amounts can span multiple years,
    and NSF is not a complete picture of U.S. research funding.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the Awards API documentation and note the 25-result page limit.
    - Search one keyword with JSON output.
    - Keep award id, title, institution, and amount.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.nsf.gov/services/v1/awards.json",
          params={"keyword": "quantum", "rpp": 25},
          timeout=30,
      )
      response.raise_for_status()
      awards = pd.json_normalize(response.json()["response"]["award"])
      awards["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(awards[["id", "title", "awardeeName", "estimatedTotalAmt"]].head())
  first_project:
    title: List recent NSF quantum awards
    goal: Test whether a keyword search can power a bounded funding inbox.
    steps:
      - Keep award id, title, awardee, and estimated total amount from the first page.
      - Sum amounts by institution and flag missing amounts.
      - Explain that page size is capped and that NSF awards are not all U.S. research funding.
