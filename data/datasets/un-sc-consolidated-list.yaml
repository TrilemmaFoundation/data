getting_started:
  overview: >
    The Security Council publishes a consolidated XML list of designated
    individuals and entities. Start with exact primary names. A string match is
    not a confirmed hit, aliases matter, and this list is not OFAC or a
    complete global sanctions product.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the consolidated list page and locate the English XML download.
    - Load INDIVIDUAL and ENTITY records from the XML.
    - Keep DATAID, first and last names or entity name, and listed-on date.
  python:
    packages:
      - pandas
      - lxml
    code: |
      import pandas as pd

      xml = pd.read_xml(
          "https://scsanctions.un.org/resources/xml/en/consolidated.xml",
          xpath=".//INDIVIDUAL",
      )
      xml["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(xml.head())
  first_project:
    title: Build an Exact-Name UN List Lookup
    goal: Test whether primary individual names can support a bounded screening prototype.
    steps:
      - Load individuals and keep DATAID plus first and last name fields.
      - Compare a short authorized name list using exact uppercase matching only.
      - Explain that aliases, transliteration, and entity records require the rest of the XML and that a match is not a legal determination.
