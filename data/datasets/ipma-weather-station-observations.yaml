getting_started:
  overview: >
    IPMA publishes a GeoJSON file of recent Portuguese weather station readings.
    Start with two features and preserve their timestamps and station IDs;
    a station reading is not a destination-wide measurement or warning.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the IPMA API documentation and noncommercial reuse conditions.
    - Download the current GeoJSON station observations.
    - Inspect two station readings and their observation times.
  python:
    packages: [requests]
    code: |
      import requests

      url = "https://api.ipma.pt/open-data/observation/meteorology/stations/obs-surface.geojson"
      response = requests.get(url, timeout=20)
      response.raise_for_status()
      for station in response.json()["features"][:2]:
          row = station["properties"]
          print(row.get("idEstacao"), row.get("time"), row.get("temperatura"))
  first_project:
    title: Show Nearby Station Weather
    goal: Present two current IPMA station readings with timestamps.
    steps:
      - Select stations by their reviewed coordinates and IDs.
      - Display temperature with its station name and observation time.
      - Explain that station conditions can differ from a travel destination.
