getting_started:
  overview: >
    UNHCR's database reports forcibly displaced and stateless populations by
    year, origin, and asylum location. Start with refugees for two countries
    across five years. End-of-year stocks are not annual flows, categories
    differ, and some values are estimates or supplied by other authorities.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read UNHCR's population-category definitions and select one measure.
    - Request a five-year window for a small country set using ISO codes.
    - Retrieve footnotes and retain the source year and country-role definitions.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.unhcr.org/population/v1/population/",
          params={
              "yearFrom": 2020,
              "yearTo": 2024,
              "coo": "AFG,UKR",
              "coa_all": "true",
              "cf_type": "ISO",
              "limit": 100,
          },
          timeout=30,
      )
      response.raise_for_status()
      population = pd.DataFrame(response.json()["items"])
      print(population[["year", "coo_name", "refugees", "asylum_seekers"]].head(20))
  first_project:
    title: Compare Displacement Stocks by Origin
    goal: Compare reported refugee and asylum-seeker stocks originating from Afghanistan and Ukraine from 2020 through 2024.
    steps:
      - Retrieve the bounded years and retain origin, asylum, and population-category fields.
      - Aggregate only compatible categories and review the associated footnotes before charting.
      - Explain why stocks are not flows and how estimates, coverage, and category definitions limit comparison.
