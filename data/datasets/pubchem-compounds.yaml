getting_started:
  overview: >
    PubChem PUG REST returns compound records by name or CID. Start with one
    chemical name. Properties can come from predicted or deposited sources,
    name resolution can hit multiple CIDs, and this is not a regulatory label.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the PUG REST documentation and choose the compound-name path.
    - Request JSON properties for one name such as aspirin.
    - Keep CID, molecular formula, and molecular weight.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/aspirin/property/MolecularFormula,MolecularWeight,IUPACName/JSON",
          timeout=30,
      )
      response.raise_for_status()
      compounds = pd.DataFrame(response.json()["PropertyTable"]["Properties"])
      compounds["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(compounds)
  first_project:
    title: Look up aspirin identifiers
    goal: Test whether PUG REST can power a bounded compound-reference card.
    steps:
      - Confirm CID, formula, and molecular weight returned for the name query.
      - Compare multiple CIDs if the name resolves to more than one compound.
      - Explain that PubChem properties may be predicted or deposited and are not a DailyMed label.
