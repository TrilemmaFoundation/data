id: copernicus-glofas-flood-outlook
name: Copernicus GloFAS Flood Outlook
description: >
  Global flood-forecast summary maps for selecting areas needing closer satellite or local-authority checks.
theme: Environment & Hazards
url: https://ows.globalfloods.eu/glofas-ows/ows.py?service=WMS&request=GetCapabilities
access_type: [api]
api_key_required: false
free_to_access: true
size_gb_min: 0
size_gb_max: 0.01
formats: [GeoTIFF]
license: >
  CEMS early-warning information permits reuse with source and modification notices; it is informational and not an official local warning.
license_url: https://drought.emergency.copernicus.eu/terms%26conditions
url_checks:
  source_marker: Flood summary for days 1-3
  license_marker: Global Flood Monitoring product
domains: [Water Resources]
data_types: [Raster]
tasks: [Monitoring]
difficulty: intermediate
geography: [Global]
temporal_coverage: dated days-one-to-three flood forecast summary
update_frequency: daily
provider: Copernicus Emergency Management Service
source_type: intergovernmental
last_verified: 2026-09-28
getting_started:
  overview: >
    GloFAS publishes the sumAL41EGE forecast-summary WMS layer used to target follow-up checks.
    Start with a small current-day tile; a forecast is not observed flooding or a local warning.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review the GloFAS WMS capabilities and CEMS reuse terms.
    - Fetch a small dated sumAL41EGE tile.
    - Compare any forecast signal with independent observed and official information.
  python:
    packages: [requests]
    code: |
      from datetime import datetime, timezone
      import requests

      valid_day = datetime.now(timezone.utc).strftime("%Y-%m-%dT00:00Z")
      response = requests.get(
          "https://ows.globalfloods.eu/glofas-ows/ows.py",
          params={"SERVICE": "WMS", "VERSION": "1.1.1", "REQUEST": "GetMap",
                  "LAYERS": "sumAL41EGE", "STYLES": "default", "SRS": "EPSG:4326",
                  "BBOX": "5,45,5.1,45.1", "WIDTH": 32, "HEIGHT": 32,
                  "FORMAT": "image/tiff", "TIME": valid_day}, timeout=20,
      )
      response.raise_for_status()
      assert response.content[:4] in (b"II*\x00", b"MM\x00*"), "Expected GeoTIFF"
      print(valid_day, "GloFAS forecast bytes:", len(response.content))
  first_project:
    title: Inspect a Flood-Outlook Tile
    goal: Display a small forecast-summary tile with its date and bounds.
    steps:
      - Fetch the current-day GloFAS WMS tile.
      - Label its forecast date and map extent.
      - Explain that a forecast alone does not establish current local flooding.
