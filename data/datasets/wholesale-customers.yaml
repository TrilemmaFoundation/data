id: wholesale-customers
name: Wholesale Customers
description: >
  Annual spending by 440 wholesale distributor clients across six product
  categories, plus customer channel and region.

url: https://archive.ics.uci.edu/dataset/292/wholesale+customers
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Retail
  - Business
data_types:
  - Tabular
tasks:
  - Clustering
  - Customer Analysis
difficulty: beginner
geography:
  - Portugal
temporal_coverage: null
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Wholesale Customers is a very small numeric table with recognizable spending
    categories. It is a good first clustering and customer-segmentation exercise.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the spending units and category fields.
    - Install ucimlrepo, then run the example to fetch dataset ID 292.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      wholesale = fetch_ucirepo(id=292)
      data = wholesale.data.original
      print(data.head())
      print(data.describe())
  first_project:
    title: Segment wholesale customers
    goal: Create a small set of interpretable spending profiles.
    steps:
      - Plot each spending category and inspect skew and extreme values.
      - Standardize or log-transform spending fields before clustering.
      - Describe each cluster using median spending, channel, and region.
