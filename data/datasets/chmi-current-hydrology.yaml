getting_started:
  overview: >
    CHMI publishes per-station current H and Q time series as small JSON files.
    Start with one station used by TravelCanary. Station observations are not
    official warnings by themselves; check timestamps and separately sourced
    flood thresholds before interpreting a value.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the CHMI open-data licence and current hydrology documentation.
    - Fetch one station JSON file from the current-data directory.
    - Inspect series type, unit, and the latest observation time.
  python:
    packages:
      - requests
    code: |
      import requests

      url = "https://opendata.chmi.cz/hydrology/now/data/0-203-1-244000.json"
      response = requests.get(url, timeout=30)
      response.raise_for_status()
      station = response.json()["objList"][0]
      for series in [row for row in station["tsList"]
                     if row["tsConID"] in ("H", "Q")][:2]:
          print(station["objID"], series["tsConID"], series.get("unit"),
                series["tsData"][-1] if series.get("tsData") else None)
  first_project:
    title: Inspect One Czech River Station
    goal: Review one bounded current observation before flood-threshold use.
    steps:
      - Keep station ID, series type, unit, and measurement time.
      - Check the observation age and applicable station threshold metadata.
      - Explain why a measured stage alone is not an official flood warning.
