getting_started:
  overview: >
    ERA5 is a global reanalysis on the Climate Data Store. Start with one
    variable, one hour, and a few-kilometer bounding box. Reanalysis blends
    observations and a model, so it is not a station measurement, and CDS
    jobs are queued rather than instant.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A CDS account, accepted ERA5 licence, and CDSAPI_KEY environment variable
  access_steps:
    - Register at the Climate Data Store and accept the ERA5 dataset licence on the download form.
    - Save your personal access token in CDSAPI_KEY.
    - Retrieve 2-metre temperature for one hour over a tiny bounding box as NetCDF.
  python:
    packages:
      - cdsapi
      - xarray
      - netCDF4
    code: |
      import os
      import cdsapi
      import xarray as xr

      client = cdsapi.Client(
          url="https://cds.climate.copernicus.eu/api",
          key=os.environ["CDSAPI_KEY"],
      )
      client.retrieve(
          "reanalysis-era5-single-levels",
          {
              "product_type": ["reanalysis"],
              "variable": ["2m_temperature"],
              "year": ["2024"],
              "month": ["07"],
              "day": ["15"],
              "time": ["12:00"],
              "area": [40.8, -74.05, 40.7, -73.95],
              "data_format": "netcdf",
              "download_format": "unarchived",
          },
          "era5_nyc_sample.nc",
      )
      sample = xr.open_dataset("era5_nyc_sample.nc")
      print(sample)
  first_project:
    title: Reconstruct One Hour of 2-Metre Temperature
    goal: Test whether a tiny ERA5 extract can power a site-history prototype.
    steps:
      - Confirm the NetCDF contains 2-metre temperature for the requested hour and bounding box.
      - Convert temperature from kelvin to Celsius and record the grid-cell center used.
      - Explain that ERA5 is a reanalysis grid, not a weather-station observation, and that queued CDS jobs can delay retrieval.
