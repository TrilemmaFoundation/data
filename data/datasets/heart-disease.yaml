getting_started:
  overview: >
    Heart Disease is a small mixed-type classification dataset with missing
    values. It is for education only and must not be used for clinical decisions.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the database and variable notes.
    - Install ucimlrepo, then run the example to fetch dataset ID 45.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      heart = fetch_ucirepo(id=45)
      data = heart.data.original
      print(data.head())
      print(data.isna().sum().sort_values(ascending=False).head())
  first_project:
    title: Build a transparent baseline
    goal: Predict disease presence while showing how missing values affect the result.
    steps:
      - Inspect target values and convert them to presence versus absence if needed.
      - Document and apply a simple missing-value strategy using training data only.
      - Fit a baseline classifier and report recall, precision, and limitations.
