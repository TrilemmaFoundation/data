id: bank-marketing
name: Bank Marketing
description: >
  Results from Portuguese bank telephone campaigns for predicting whether a
  client subscribes to a term deposit.

url: https://archive.ics.uci.edu/dataset/222/bank+marketing
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Finance
  - Marketing
data_types:
  - Tabular
tasks:
  - Classification
  - Customer Analysis
difficulty: intermediate
geography:
  - Portugal
temporal_coverage: 2008-2010
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Bank Marketing is a practical classification problem with mixed feature
    types and an imbalanced target, making evaluation choices especially important.
  prerequisites:
    - Python 3.10 or newer
    - Basic familiarity with classification metrics
  access_steps:
    - Open the official UCI page and review the campaign context and variables.
    - Install ucimlrepo, then run the example to fetch dataset ID 222.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      bank = fetch_ucirepo(id=222)
      data = bank.data.original
      print(data.head())
      print(bank.data.targets.value_counts(normalize=True))
  first_project:
    title: Predict term-deposit subscriptions
    goal: Create a baseline classifier that treats the minority class honestly.
    steps:
      - Inspect categorical values and calculate the target class balance.
      - Train a model without using call duration, which is unknown before a call ends.
      - Report precision, recall, and ROC AUC rather than accuracy alone.
