getting_started:
  overview: >
    EFFIS exposes effis.nrt.ba.poly polygons through its WFS, separately from thermal-detection points.
    Start with one bounded feature request; an empty result is not proof of no fires.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review EFFIS's burned-area service and attribution rules.
    - Request at most one effis.nrt.ba.poly feature in a small bounding box.
    - Keep mapping time and spatial coverage distinct from active-fire detections.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://maps.effis.emergency.copernicus.eu/effis",
          params={"service": "WFS", "version": "1.1.0", "request": "GetFeature",
                  "typeName": "effis.nrt.ba.poly", "maxFeatures": 1,
                  "bbox": "5,45,6,46,EPSG:4326"},
          timeout=25,
      )
      response.raise_for_status()
      assert b"FeatureCollection" in response.content[:4096]
      print("EFFIS perimeter response bytes:", len(response.content))
  first_project:
    title: Inspect a Recent Perimeter Query
    goal: Query a bounded recent burned-area polygon layer.
    steps:
      - Request one feature at most in a small European bounding box.
      - Record whether a polygon was returned and its geographic bounds.
      - Explain that an empty query cannot establish an all-clear.
