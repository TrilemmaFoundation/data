getting_started:
  overview: >
    Forest Fires is small and understandable, but its burned-area target is
    highly skewed. That makes it a useful lesson in transformations and honest evaluation.
  prerequisites:
    - Python 3.10 or newer
    - Basic familiarity with numeric distributions
  access_steps:
    - Open the official UCI page and read the notes about the burned-area target.
    - Install ucimlrepo, then run the example to fetch dataset ID 162.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      fires = fetch_ucirepo(id=162)
      data = fires.data.original
      print(data.head())
      print(fires.data.targets.describe())
  first_project:
    title: Explore burned-area patterns
    goal: Explain how weather conditions differ between small and large recorded fires.
    steps:
      - Plot the burned-area distribution before and after a log1p transformation.
      - Compare temperature, humidity, wind, and rain across fire-size groups.
      - Fit a baseline regression model and report error on the transformed target.
