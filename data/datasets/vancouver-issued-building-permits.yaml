getting_started:
  overview: >
    Start with one permit category and a small recent API page. The records
    describe permits when first issued, not their current status or later
    changes, and some addresses cannot be geocoded.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official dataset page and review the issuance and geocoding notes.
    - Query a bounded page through the OpenDataSoft API.
    - Keep permit number, issue date, value, elapsed days, permit category, work type, use, and local area.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      url = "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/issued-building-permits/records"
      response = requests.get(
          url,
          params={"limit": 100, "order_by": "issuedate DESC"},
          timeout=30,
      )
      response.raise_for_status()
      permits = pd.json_normalize(response.json()["results"])
      columns = [
          "permitnumber",
          "issuedate",
          "projectvalue",
          "permitelapseddays",
          "permitcategory",
          "typeofwork",
          "propertyuse",
          "geolocalarea",
      ]
      print(permits[columns].head())
  first_project:
    title: Compare Building Permit Timelines
    goal: Test whether issued permits can support a neighbourhood construction pipeline monitor.
    steps:
      - Group the sample by permit category and local area.
      - Compare median project value and elapsed days across groups.
      - Explain why issued-only records, applicant response time, and missing coordinates limit performance conclusions.
