getting_started:
  overview: >
    AirData publishes daily summaries from EPA's regulatory Air Quality System.
    Start with one pollutant, one year, and one state. Monitor coverage and
    methods change, recent values may not be certified, and these historical
    regulatory records differ from preliminary operational AirNow data.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - Enough memory for one annual pollutant ZIP file
  access_steps:
    - Open AirData and select one daily pollutant file and year.
    - Read the file-format documentation and retain site, parameter, standard, and method identifiers.
    - Filter immediately to one state and record the file update date.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      url = "https://aqs.epa.gov/aqsweb/airdata/daily_88101_2025.zip"
      daily = pd.read_csv(url, dtype={"State Code": "string", "County Code": "string", "Site Num": "string"})
      california = daily[daily["State Code"] == "06"].copy()
      california["Date Local"] = pd.to_datetime(california["Date Local"])
      print(california[["Date Local", "County Code", "Site Num", "Arithmetic Mean", "Units of Measure"]].head(20))
  first_project:
    title: Compare daily PM2.5 summaries within one state
    goal: Review 2025 daily PM2.5 summaries for California monitoring sites.
    steps:
      - Filter the annual file to California and construct a stable site identifier from state, county, and site codes.
      - Summarize completeness and arithmetic means by site without mixing units or standards.
      - Explain how monitor placement, methods, completeness, certification timing, and AirNow differences limit conclusions.
