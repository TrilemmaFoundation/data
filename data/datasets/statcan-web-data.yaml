getting_started:
  overview: >
    The Web Data Service returns cube metadata and vector series as JSON. Start
    with one vector id such as a national unemployment rate. Cube ids change
    when tables are terminated, and bilingual labels can differ.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the WDS documentation and copy one vector identifier from a CANSIM table.
    - POST getDataFromVectorsAndLatestNPeriods for a few periods.
    - Cite Statistics Canada under the Open Licence.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.post(
          "https://www150.statcan.gc.ca/t1/wds/rest/getDataFromVectorsAndLatestNPeriods",
          json=[{"vectorId": 2062811, "latestN": 12}],
          timeout=30,
      )
      response.raise_for_status()
      series = pd.json_normalize(response.json()[0]["object"]["vectorDataPoint"])
      series["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(series.head())
  first_project:
    title: Chart a Canadian Labour Vector
    goal: Test whether one WDS vector can power a bounded provincial-or-national labour sketch.
    steps:
      - Confirm twelve vector data points returned for the selected vector id.
      - Plot the reference periods and values.
      - Cite Statistics Canada and explain that terminated cubes change identifiers and that this is not U.S. BLS data.
