getting_started:
  overview: The official Vigicrues feed supports regional hazard context. Start with two French river-vigilance
    items; a feed item covers its named river segment, not every nearby location.
  prerequisites:
  - Python 3.10 or newer
  - An internet connection
  - The requests Python package
  access_steps:
  - Read the official feed documentation and reuse terms.
  - Fetch one bounded official response.
  - Inspect two records and retain their validity period.
  python:
    packages:
    - requests
    code: |
      import requests
      from xml.etree import ElementTree as ET

      response = requests.get("https://www.vigicrues.gouv.fr/territoire/rss", timeout=20)
      response.raise_for_status()
      root = ET.fromstring(response.content)
      for item in root.findall("./channel/item")[:2]:
          print(item.findtext("title"), item.findtext("pubDate"), item.findtext("link"))
  first_project:
    title: Map Dated Regional Warnings
    goal: Inspect two French river-vigilance items with official validity and source links.
    steps:
    - Fetch one official response and retain its issue time.
    - Display two region or river records with their source links.
    - Explain why coverage and validity cannot be inferred beyond the named area.
