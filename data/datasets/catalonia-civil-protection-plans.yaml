getting_started:
  overview: >
    The Generalitat publishes the current pre-alert, alert, and emergency
    phases of Catalan civil-protection plans through one Socrata dataset.
    Start with five records. A plan phase is regional context and must not be
    treated as a destination-specific evacuation order. Attribute the agency,
    preserve meaning, and show the last update date.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the exact dataset metadata and Catalan reuse conditions.
    - Request five current plan rows from the official dataset API.
    - Inspect acronym, phase, activation flag, and phase timestamp.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://analisi.transparenciacatalunya.cat/resource/wj9c-j6vf.json",
          params={"$limit": 5}, timeout=30,
      )
      response.raise_for_status()
      for plan in response.json():
          print(plan.get("plaacronim"), plan.get("plafase"),
                plan.get("plaactivat"), plan.get("fasedatahora"))
  first_project:
    title: Inspect Current Catalan Plan Phases
    goal: Review five official plan records for regional emergency context.
    steps:
      - Keep plan acronym, phase, activation flag, and update timestamp.
      - Link the official CECAT communication when one is supplied.
      - Explain why a regional plan phase is not a local restriction or order.
