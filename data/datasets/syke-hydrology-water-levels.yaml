getting_started:
  overview: >
    SYKE's Hydrologiarajapinta OData service exposes Vedenkorkeus water-level observations and separate datum metadata.
    Start with one recent value; a level cannot be compared across stations without reference-system and quality checks.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review the SYKE hydrology OData entities and CC BY licence.
    - Request one latest Vedenkorkeus row.
    - Keep its place ID, timestamp, value, and quality flag for later station-metadata lookup.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://rajapinnat.ymparisto.fi/api/Hydrologiarajapinta/1.2/odata/Vedenkorkeus",
          params={"$top": 1, "$orderby": "Aika desc"},
          headers={"Accept": "application/json"}, timeout=25,
      )
      response.raise_for_status()
      for row in response.json()["value"]:
          print(row["Paikka_Id"], row["Aika"], row["Arvo"], row["Lippu_id"])
  first_project:
    title: Inspect One Finnish Water Level
    goal: Display one dated OData measurement with its station and quality identifiers.
    steps:
      - Fetch one recent Vedenkorkeus record.
      - Show its place ID, date, value, and quality-flag ID.
      - Explain that a datum lookup is needed before cross-station comparison.
