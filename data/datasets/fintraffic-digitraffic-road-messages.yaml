getting_started:
  overview: >
    Digitraffic returns current road messages with mapped geometry. Begin by
    counting a few announcement categories from one snapshot. The feed is not
    complete route advice; inspect event type, validity, and geometry before
    associating a closure with a destination.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Review the road-traffic documentation and CC BY attribution terms.
    - Fetch one current v2 traffic-announcement GeoJSON response.
    - Inspect event categories before filtering to accident-related closures.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://tie.digitraffic.fi/api/traffic-message/v2/traffic-announcements",
          timeout=30,
      )
      response.raise_for_status()
      features = response.json()["features"]
      for item in features[:5]:
          properties = item["properties"]
          print(properties["situationId"], properties["situationType"],
                properties["releaseTime"])
  first_project:
    title: Inspect Finnish Road Message Types
    goal: Identify which live message categories could support a local disruption card.
    steps:
      - Count current messages by situation type and retain update timestamps.
      - Check geometry and validity before labeling a message as local.
      - Credit Fintraffic and explain why the feed is not complete routing advice.
