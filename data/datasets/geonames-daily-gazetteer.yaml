getting_started:
  overview: >
    GeoNames publishes daily place-name dumps. Start with the small Andorra
    country archive and retain its attribution. Place names and representative
    coordinates are imperfect and do not define exact administrative boundaries.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Review the official export terms and source attribution requirements.
    - Download one small country archive rather than the global dump.
    - Inspect the tab-separated place records and retain their GeoNames IDs.
  python:
    packages:
      - requests
    code: |
      import csv
      import io
      from zipfile import ZipFile
      import requests

      response = requests.get("https://download.geonames.org/export/dump/AD.zip", timeout=30)
      response.raise_for_status()
      archive = ZipFile(io.BytesIO(response.content))
      with archive.open("AD.txt") as file:
          rows = csv.reader(io.TextIOWrapper(file, encoding="utf-8"), delimiter="\t")
          for row in list(rows)[:5]:
              print(row[0], row[1], row[4], row[5])
  first_project:
    title: Inspect an Andorran Place Index
    goal: Evaluate a bounded place-name dump for a destination search prototype.
    steps:
      - Keep GeoNames identifiers, names, coordinates, and download date.
      - Compare the first five rows with their official GeoNames pages.
      - Explain attribution duties and why point coordinates are not exact boundaries.
