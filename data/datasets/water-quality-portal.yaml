getting_started:
  overview: >
    The Water Quality Portal returns discrete sample chemistry, not continuous
    USGS gauge readings or EPA drinking-water system compliance records. Start
    with nitrate results for one monitoring location and a one-year window.
    Sampling is irregular, so a gap is not a clean bill of health.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the Water Quality Portal description and distinguish sample results from gauge time series.
    - Request a bounded CSV extract for one site, one characteristic, and a short date range.
    - Keep the monitoring location, characteristic, result value, unit, and activity date.
  python:
    packages:
      - pandas
      - requests
    code: |
      import io
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.waterqualitydata.us/data/Result/search",
          params={
              "siteid": "USGS-01646500",
              "characteristicName": "Nitrate",
              "startDateLo": "01-01-2024",
              "startDateHi": "12-31-2024",
              "mimeType": "csv",
              "zip": "no",
              "dataProfile": "narrowResult",
          },
          timeout=60,
      )
      response.raise_for_status()
      results = pd.read_csv(io.StringIO(response.text))
      results["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(
          results[
              [
                  "MonitoringLocationIdentifier",
                  "ActivityStartDate",
                  "CharacteristicName",
                  "ResultMeasureValue",
                  "ResultMeasure/MeasureUnitCode",
              ]
          ].head(20)
      )
  first_project:
    title: Chart recent nitrate samples at one Potomac gauge
    goal: Test whether discrete nitrate results can power a bounded watershed-quality monitor.
    steps:
      - Convert ResultMeasureValue to numeric and keep the activity date, unit, and detection-condition text.
      - Plot the 2024 samples and note days with no observation.
      - Explain that irregular sampling is not a continuous water-quality record and is not a drinking-water compliance result.
