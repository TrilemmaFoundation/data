getting_started:
  overview: >
    Start with one business type and a small page of current licence records.
    Categories changed in May 2024, home-based business addresses can be
    withheld, and licence records do not prove that a business is operating.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official dataset page and review the category-change and privacy notes.
    - Query a bounded page through the OpenDataSoft API.
    - Keep the unique licence identifier, category, status, dates, local area, and employee count.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      url = "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/business-licences/records"
      response = requests.get(
          url,
          params={"limit": 100, "order_by": "issueddate DESC"},
          timeout=30,
      )
      response.raise_for_status()
      licences = pd.json_normalize(response.json()["results"])
      columns = [
          "licencersn",
          "businesstype",
          "businesssubtype",
          "status",
          "issueddate",
          "localarea",
          "numberofemployees",
      ]
      print(licences[columns].head())
  first_project:
    title: Track Business Licence Activity
    goal: Test whether current licence records can support a neighbourhood commercial activity monitor.
    steps:
      - Count issued records by business type and local area.
      - Compare issue dates and reported employee counts for the largest groups.
      - Explain why category changes, withheld addresses, and licence status limit conclusions about openings and closures.
