getting_started:
  overview: >
    GH Archive stores hourly gzip JSON of public GitHub events. Start with one
    UTC hour and stream the first events rather than loading the whole file.
    Do not use BigQuery for this guide, and public events still fall under
    GitHub's terms.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open gharchive.org and note the hourly URL pattern.
    - Stream one recent hourly gzip.
    - Keep event type and repository name from the first records.
  python:
    packages:
      - pandas
      - requests
    code: |
      import gzip
      import json
      import pandas as pd
      import requests

      response = requests.get(
          "https://data.gharchive.org/2026-08-17-15.json.gz",
          stream=True,
          timeout=60,
      )
      response.raise_for_status()
      response.raw.decode_content = True
      rows = []
      with gzip.GzipFile(fileobj=response.raw) as archive:
          for line in archive:
              event = json.loads(line)
              rows.append(
                  {
                      "type": event.get("type"),
                      "repo": (event.get("repo") or {}).get("name"),
                  }
              )
              if len(rows) >= 50:
                  break
      events = pd.DataFrame(rows)
      print(events.head())
  first_project:
    title: Count event types in one GitHub hour
    goal: Test whether a streamed hour can power a bounded activity monitor.
    steps:
      - Stream the first 50 events from one hourly gzip and keep type plus repository.
      - Count event types in that sample.
      - Explain that the sample is not the full hour, BigQuery is out of scope here, and GitHub terms apply to public event data.
