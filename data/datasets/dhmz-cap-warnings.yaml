id: dhmz-cap-warnings
name: DHMZ Croatia CAP Warnings
description: >
  Croatian weather warnings published as CAP XML by DHMZ for reading official
  warning severity, geography, and validity.
theme: Environment & Hazards
url: https://meteo.hr/proizvodi.php?section=podaci&param=xml_korisnici
access_type:
  - download
api_key_required: false
free_to_access: true
size_gb_min: 0
size_gb_max: 0.01
formats:
  - XML
license: Croatian Open Licence; DHMZ attribution is required.
license_url: https://meteo.hr/proizvodi.php?section=podaci&param=xml_korisnici
url_checks:
  source_marker: cap_hr_today.xml
  license_marker: Otvorenom dozvolom
domains:
  - Weather
  - Emergency Management
data_types:
  - Event Data
  - Geospatial
tasks:
  - Monitoring
  - Alerting
difficulty: intermediate
geography:
  - Croatia
temporal_coverage: current daily CAP warning files
update_frequency: daily
provider: Croatian Meteorological and Hydrological Service
source_type: government
last_verified: 2026-09-28
getting_started:
  overview: >
    DHMZ lists freely reusable Croatian CAP warning files with attribution.
    Start with today's CAP XML file and inspect its message ID, status and
    issue time. A feed may contain updates or cancellations; check validity
    and mapped area before displaying any warning.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official DHMZ XML file list and open-licence statement.
    - Download today's CAP file, retaining its source URL and retrieval time.
    - Inspect CAP status and geography before treating it as a current warning.
  python:
    packages:
      - requests
    code: |
      import xml.etree.ElementTree as ET
      import requests

      response = requests.get("https://meteo.hr/upozorenja/cap_hr_today.xml", timeout=30)
      response.raise_for_status()
      root = ET.fromstring(response.content)
      cap = "{urn:oasis:names:tc:emergency:cap:1.2}"
      print(root.findtext(f"{cap}identifier"), root.findtext(f"{cap}status"),
            root.findtext(f"{cap}sent"))
  first_project:
    title: Inspect One Croatian CAP Message
    goal: Check an official warning file for a small regional alert display.
    steps:
      - Keep CAP identifier, issue time, status, type, and affected area.
      - Account for update and cancel messages before displaying severity.
      - Explain why a downloaded CAP message alone does not prove local applicability.
