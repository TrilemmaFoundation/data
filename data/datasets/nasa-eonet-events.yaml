getting_started:
  overview: >
    EONET curates recent natural-event metadata from multiple sources. Start
    with three open events and inspect IDs, categories, and source links.
    NASA warns that event extents are approximate and not official; the
    rights of separately linked source observations must be reviewed before
    republishing those observations.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the EONET v3 API documentation and event disclaimer.
    - Request three open events in one bounded call.
    - Keep event IDs and source links separate from local warning evidence.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://eonet.gsfc.nasa.gov/api/v3/events",
          params={"limit": 3, "status": "open"}, timeout=30,
      )
      response.raise_for_status()
      for event in response.json()["events"][:3]:
          print(event["id"], event["title"],
                [category["id"] for category in event["categories"]])
  first_project:
    title: Inspect Recent Natural Events
    goal: Review a small EONET response as contextual discovery data.
    steps:
      - Keep event ID, categories, source URLs, and geometry dates.
      - Verify independent official sources before local hazard conclusions.
      - Explain why an EONET event extent is not an official warning area.
