getting_started:
  overview: >
    FMI provides a CAP-backed RSS feed of current Finnish warnings. Start with
    one English feed response and inspect its channel update time and up to
    five entries. An empty feed is not proof that every location is safe.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read FMI's CAP profile and CC BY open-data licence.
    - Fetch the English RSS feed once and record its publication time.
    - Follow a linked CAP message for full event, area, and validity details.
  python:
    packages:
      - requests
    code: |
      import xml.etree.ElementTree as ET
      import requests

      response = requests.get("https://alerts.fmi.fi/cap/feed/rss_en-GB.rss", timeout=30)
      response.raise_for_status()
      channel = ET.fromstring(response.content).find("channel")
      print(channel.findtext("pubDate"), len(channel.findall("item")))
      for item in channel.findall("item")[:5]:
          print(item.findtext("title"), item.findtext("link"))
  first_project:
    title: Inspect Current Finnish Warning Entries
    goal: Test a small official warning index before mapping CAP areas.
    steps:
      - Keep feed publication time and each item's official CAP link.
      - Check CAP issue, expiry, and affected geometry before display.
      - Explain why the RSS index is not a complete local all-clear.
