getting_started:
  overview: >
    OPW publishes a pre-generated GeoJSON snapshot of latest readings. Start with five eligible readings. Use that
    file for automated access and restrict republication to eligible station
    numbers 00001-41000. Measurements are provisional, relative to station
    gauge zero, and are not official flood warnings.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official API page, station eligibility rule, and CC BY terms.
    - Fetch the pre-generated latest-readings GeoJSON at a sensible interval.
    - Filter to eligible station numbers before using or republishing values.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get("https://waterlevel.ie/geojson/latest/", timeout=30)
      response.raise_for_status()
      features = response.json()["features"]
      eligible = [
          item["properties"] for item in features
          if 1 <= int(item["properties"]["station_ref"]) <= 41000
      ]
      for item in eligible[:5]:
          print(item["station_ref"], item["datetime"], item["value"])
  first_project:
    title: Check Recent Eligible Gauge Readings
    goal: Assess whether a small set of current gauges supports a factual river-level panel.
    steps:
      - Retain station and sensor IDs, timestamps, quality codes, and gauge units.
      - Exclude out-of-range station references from republication.
      - State that provisional gauge readings are not official flood warnings.
