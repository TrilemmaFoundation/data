getting_started:
  overview: >
    IMGW publishes current hydrological bulletins as separate text files.
    Free access is limited to qualifying noncommercial analysis; commercial
    and specified sectoral uses can require an agreement and payment. Start
    with at most five listed bulletins and preserve issue and validity times.
    TravelCanary uses flood warnings and excludes drought notices in this
    shared directory. An empty directory is not the same as an API failure.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read IMGW's access regulation and official current-bulletin listing.
    - Find one TXT bulletin in the current directory.
    - Inspect issue time, warning degree, affected region, and validity.
  python:
    packages:
      - requests
    code: |
      import re
      import requests

      base = "https://danepubliczne.imgw.pl/data/current/ost_hydro/"
      listing = requests.get(base, timeout=30)
      listing.raise_for_status()
      names = sorted(set(re.findall(r'href="([A-Za-z0-9_-]+\.TXT)"', listing.text)))
      print(f"{len(names)} current bulletin files")
      for name in names[:5]:
          bulletin = requests.get(base + name, timeout=30)
          bulletin.raise_for_status()
          text = bulletin.content.decode("utf-8", errors="replace")
          if "susza hydrologiczna" not in text.lower():
              print(name, text[:400])
              break
      else:
          print("No flood bulletin among the first five listed files")
  first_project:
    title: Inspect a Polish Hydrological Warning
    goal: Review one official text bulletin before region matching.
    steps:
      - Keep bulletin name, issue time, degree, region, and validity period.
      - Detect revised and cancelled bulletins before current display.
      - Explain why an absent bulletin is not a statement of future safety.
