getting_started:
  overview: >
    Start with one species and a small API page of mapped trees. Private trees
    are excluded, records without coordinates are absent, and some attributes
    may be several years out of date.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official dataset page and review the inventory and attribute-age notes.
    - Query a bounded page through the OpenDataSoft API.
    - Keep asset id, species, dimensions, planting date, and coordinates.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      url = "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/public-trees/records"
      response = requests.get(url, params={"limit": 100}, timeout=30)
      response.raise_for_status()
      trees = pd.json_normalize(response.json()["results"])
      columns = [
          "asset_id",
          "common_name",
          "genus_name",
          "species_name",
          "height_m",
          "diameter_cm",
          "date_planted",
          "geo_point_2d.lat",
          "geo_point_2d.lon",
      ]
      print(trees[columns].head())
  first_project:
    title: Map Public Tree Diversity
    goal: Test whether species counts can support a local urban-forest diversity map.
    steps:
      - Count sampled trees by genus and species.
      - Compare diameter and height distributions for the most common species.
      - Explain why private-tree exclusion, missing coordinates, and stale attributes limit canopy conclusions.
