id: online-retail
name: Online Retail
description: >
  More than 500,000 transactions from a UK-based online retailer, including
  products, quantities, prices, customers, countries, and cancellations.

url: https://archive.ics.uci.edu/dataset/352/online+retail
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0.01
size_gb_max: 0.1
formats:
  - Excel
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Retail
  - Business
data_types:
  - Transactional
  - Time Series
tasks:
  - Customer Analysis
  - Clustering
difficulty: intermediate
geography:
  - United Kingdom
  - International
temporal_coverage: 2010-2011
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Online Retail is large enough to feel realistic while remaining laptop-friendly.
    It introduces transaction cleaning, cancellations, dates, and customer aggregation.
  prerequisites:
    - Python 3.10 or newer
    - Basic familiarity with grouping and date columns
  access_steps:
    - Open the official UCI page and review the transaction field definitions.
    - Install ucimlrepo, then run the example to fetch dataset ID 352.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      retail = fetch_ucirepo(id=352)
      data = retail.data.original
      print(data.head())
      print(data.isna().sum().sort_values(ascending=False).head())
  first_project:
    title: Build a customer sales summary
    goal: Rank customers by completed order value while handling returns correctly.
    steps:
      - Parse InvoiceDate and identify cancellations and negative quantities.
      - Calculate line revenue and aggregate completed sales by customer.
      - Plot monthly revenue and describe the strongest seasonal pattern.
