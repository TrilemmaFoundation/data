getting_started:
  overview: >
    MetAlerts publishes official weather warnings in CAP and beta GeoJSON.
    Start with five features from the current GeoJSON endpoint. Preserve CAP
    IDs, updates and cancellations when building an alert timeline, and use a
    distinct client User-Agent. Weather alerts differ from Locationforecast.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the MetAlerts documentation and MET Norway attribution policy.
    - Set an identifying User-Agent and request current GeoJSON warnings.
    - Inspect area, event, and validity before using an alert in a product.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://api.met.no/weatherapi/metalerts/2.0/current.json",
          headers={"User-Agent": "TrilemmaDataCatalogExample/1.0 (https://data.trilemma.foundation)"},
          timeout=30,
      )
      response.raise_for_status()
      for warning in response.json()["features"][:5]:
          details = warning["properties"]
          print(details.get("id"), details.get("event"), details.get("area"))
  first_project:
    title: Inspect Norwegian Weather Alerts
    goal: Test whether current alert geometry supports a local warning card.
    steps:
      - Keep alert ID, event, severity, geometry, and validity interval.
      - Account for CAP updates and cancellations before retaining a warning.
      - Attribute MET Norway and avoid equating an empty sample with safety.
