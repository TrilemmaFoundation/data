getting_started:
  overview: >
    The Police API returns street-level crimes for a point or custom area.
    Start with one coordinate pair and the most recently published month.
    Locations are snapped to anonymised map points, reporting coverage varies
    by force, and counts are not official statistics.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the data.police.uk about page and the Open Government Licence notice.
    - Request street-level crimes for one latitude and longitude.
    - Keep category, month, and the anonymised street name.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://data.police.uk/api/crimes-street/all-crime",
          params={"lat": 51.5074, "lng": -0.1278},
          timeout=30,
      )
      response.raise_for_status()
      crimes = pd.json_normalize(response.json())
      print(crimes[["id", "category", "month", "location.street.name"]].head(20))
      print(crimes["category"].value_counts().head())
  first_project:
    title: Summarise recent street crime around one point
    goal: Test whether category counts can power a neighbourhood safety snapshot.
    steps:
      - Keep crime id, category, month, and anonymised street name.
      - Count records by category and flag missing coordinates.
      - Explain that points are snapped for privacy and that force coverage and lag limit comparison across areas.
