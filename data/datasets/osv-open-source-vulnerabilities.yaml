getting_started:
  overview: >
    OSV.dev aggregates OpenSSF OSV-format advisories and matches them to package
    names, versions, and commits. Start by querying one pinned package version.
    A match is not the same as a CVE or CPE lookup in NVD, and it does not prove
    that your deployed code path is exploitable.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the OSV.dev API examples and choose one ecosystem, package name, and version.
    - POST a bounded query for that exact package version.
    - Record the package coordinates and retrieval timestamp before triaging aliases.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.post(
          "https://api.osv.dev/v1/query",
          json={
              "version": "2.4.1",
              "package": {"name": "jinja2", "ecosystem": "PyPI"},
          },
          timeout=30,
      )
      response.raise_for_status()
      advisories = pd.DataFrame(response.json().get("vulns", []))
      advisories["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(advisories[["id", "summary", "published"]].head(20))
  first_project:
    title: Check One Pinned Python Package for Known Advisories
    goal: List OSV advisories that match a specific PyPI package version and note their aliases.
    steps:
      - Confirm the query returned vulnerability IDs for the pinned package version.
      - Expand aliases such as CVE or GHSA identifiers and record whether a fix version is listed.
      - Explain that package-resolved OSV matches are not a substitute for NVD CPE search or proof of exploitability in your application.
