getting_started:
  overview: >
    CHMI publishes a dated flash-flood risk JSON product by Czech ORP area.
    Start with one response and inspect at most five areas if present. A
    response with only report metadata means no listed risk areas; it does not
    replace current station observations or general flood guidance.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read CHMI's risk-class metadata and CC BY 4.0 condition.
    - Fetch the current risk product once.
    - Keep creation time, ORP code, and resulting risk class.
  python:
    packages:
      - requests
    code: |
      import requests

      url = "https://opendata.chmi.cz/hydrology/product/data/flash_flood/risk_FF_web.json"
      response = requests.get(url, timeout=30)
      response.raise_for_status()
      product = response.json()
      print(product["datumVytvoreni"])
      for key, areas in product["data"].items():
          if key == "report":
              continue
          for area in areas[:5]:
              print(area.get("kod_orp_ruian"), area.get("riziko_vysledne"))
  first_project:
    title: Inspect Czech Flash-Flood Areas
    goal: Review official nonzero risk classes against one mapped locality.
    steps:
      - Keep the issue time, ORP identifier, and forecast risk class.
      - Distinguish forecast risk from measured water levels.
      - Explain why no listed areas do not imply permanent or nationwide safety.
