url: https://www.census.gov/construction/bps/
access_type:
  - download
api_key_required: false
free_to_access: true
size_gb_min: 0
size_gb_max: 0.01
formats:
  - CSV
  - XLSX
license: U.S. Government public data / federal copyright guidance
license_url: https://www.usa.gov/government-copyright
url_checks:
  source_marker: new privately-owned residential construction
  license_marker: federal government materials
domains:
