last_verified: 2026-09-28
getting_started:
  overview: >
    Meteo LT publishes current measured water levels at named hydro-stations in centimeters.
    Start with one documented station; a water level without a station datum or official threshold is not a flood warning.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the hydro-station endpoint documentation and CC BY-SA terms.
    - Fetch the latest observations for one documented station.
    - Keep its UTC observation time, station name, and water-level unit together.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://api.meteo.lt/v1/hydro-stations/nemajunu-vms/observations/measured/latest",
          timeout=20,
      )
      response.raise_for_status()
      data = response.json()
      for observation in data["observations"][-2:]:
          print(data["station"]["name"], observation["observationTimeUtc"],
                observation["waterLevel"], "cm")
  first_project:
    title: Inspect One River Station
    goal: Show one recent Lithuanian station water level with its time and unit.
    steps:
      - Fetch the documented station's latest measured observations.
      - Display its station name, UTC time, and centimeter level.
      - Explain why the value cannot be treated as an official flood warning.
