getting_started:
  overview: >
    The National Weather Service API provides official U.S. forecasts,
    observations, watches, warnings, and advisories. Start with one coordinate
    and the hourly forecast returned for its grid point. Forecasts can change,
    and an application must not present stale or transformed data as an active
    official warning.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A descriptive application URL or email address for the required User-Agent header
  access_steps:
    - Read the API documentation and choose one U.S. coordinate.
    - Send the coordinate to the points endpoint to discover its current hourly forecast URL.
    - Request the forecast with a descriptive User-Agent and save its update timestamp.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      headers = {
          "User-Agent": "TrilemmaDataGuide/1.0 (https://data.trilemma.foundation)"
      }
      point = requests.get(
          "https://api.weather.gov/points/40.7128,-74.0060",
          headers=headers,
          timeout=30,
      )
      point.raise_for_status()
      forecast_url = point.json()["properties"]["forecastHourly"]
      forecast = requests.get(forecast_url, headers=headers, timeout=30)
      forecast.raise_for_status()
      hours = pd.json_normalize(forecast.json()["properties"]["periods"])
      print(hours[["startTime", "temperature", "windSpeed", "shortForecast"]].head())
  first_project:
    title: Flag risky hours for an outdoor plan
    goal: Test whether the hourly forecast can provide a useful weather-risk signal for one location.
    steps:
      - Convert forecast start times to timezone-aware timestamps and select the next 24 hours.
      - Flag periods containing rain, storms, snow, or high winds in the forecast fields.
      - Explain when the data was issued, how often the product must refresh it, and why users should still follow official alerts.
