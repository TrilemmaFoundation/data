getting_started:
  overview: >
    The NTD monthly release reports service and unlinked passenger trips by
    transit agency and mode. Start with the adjusted monthly file and a few
    agencies. Values can be revised, reporting practices differ, and unlinked
    passenger trips count boardings rather than unique people.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - The current Monthly Module Adjusted Data Release downloaded from FTA
  access_steps:
    - Open NTD Data and download the current Complete Monthly Ridership workbook.
    - Save it as complete_monthly_ridership.xlsx and record the release date in the notebook.
    - Select a small agency set and compare like-for-like modes and metrics.
  python:
    packages:
      - pandas
      - openpyxl
    code: |
      import pandas as pd

      ridership = pd.read_excel(
          "complete_monthly_ridership.xlsx",
          sheet_name="UPT",
      )
      agencies = ridership[ridership["Agency"].isin([
          "New York City Transit",
          "Chicago Transit Authority",
      ])].copy()
      print(agencies.head(20))
  first_project:
    title: Compare Monthly Transit Ridership Recovery
    goal: Compare reported passenger trips for two agencies with the same mode against the prior year.
    steps:
      - Record the file release and filter to two agencies and one common transit mode.
      - Calculate year-over-year change for matched months and inspect missing or revised values.
      - Explain why unlinked trips, reporting differences, revisions, and service changes limit comparisons.
