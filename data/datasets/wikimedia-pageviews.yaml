getting_started:
  overview: >
    The Wikimedia Analytics API reports pageviews for Wikimedia projects.
    Start with one English Wikipedia article and a short daily window. Send a
    descriptive User-Agent with contact information; generic python-requests
    clients may be blocked. Pageviews are not a measure of quality or demand.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the Analytics API access policy, including the User-Agent requirement.
    - Choose one article title encoded for the URL path.
    - Request a bounded daily pageview series and keep requests serial.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/"
          "en.wikipedia/all-access/user/Earth/daily/20250801/20250807",
          headers={
              "User-Agent": (
                  "TrilemmaDataCatalogExample/1.0 "
                  "(https://data.trilemma.foundation)"
              )
          },
          timeout=30,
      )
      response.raise_for_status()
      pageviews = pd.DataFrame(response.json()["items"])
      pageviews["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(pageviews[["timestamp", "views"]])
  first_project:
    title: Chart one Wikipedia article's daily pageviews
    goal: Describe how views of one article moved across a seven-day window.
    steps:
      - Confirm the response includes daily view counts for the selected article and dates.
      - Plot views over time and note spikes that may reflect news coverage rather than lasting interest.
      - State that pageviews are not a measure of article quality, public opinion, or product demand.
