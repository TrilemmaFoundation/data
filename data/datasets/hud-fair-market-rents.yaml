getting_started:
  overview: >
    HUD publishes Fair Market Rents by county and metro area. Start with one
    state's statedata endpoint for a single fiscal year. FMR is a 40th-percentile
    estimate used in voucher programs, not an observed asking rent.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free HUD User API token saved in the HUD_API_TOKEN environment variable
  access_steps:
    - Register for a HUD User API token from the FMR API documentation on HUD User.
    - Save the token in the HUD_API_TOKEN environment variable.
    - Request one state's county FMRs for a single fiscal year.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.huduser.gov/hudapi/public/fmr/statedata/CO",
          params={"year": 2025},
          headers={"Authorization": f"Bearer {os.environ['HUD_API_TOKEN']}"},
          timeout=30,
      )
      response.raise_for_status()
      payload = response.json()["data"]
      rents = pd.DataFrame(payload.get("counties", payload))
      rents["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(rents.head(20))
  first_project:
    title: Compare Two-Bedroom FMRs across One State's Counties
    goal: Test whether county FMRs can support a bounded rent-burden screen.
    steps:
      - Keep county names and two-bedroom FMR values for Colorado.
      - Rank counties and flag missing bedroom-size fields.
      - State that FMR is not observed asking rent and that Small Area FMRs can differ inside a metro.
