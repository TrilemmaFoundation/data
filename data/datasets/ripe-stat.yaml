getting_started:
  overview: >
    RIPEstat data API returns JSON for a resource such as an IP prefix or ASN.
    Start with prefix-overview for one well-known prefix. Routing views change,
    WHOIS fields can be stale, and this is not packet capture.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the RIPEstat data API documentation and choose prefix-overview.
    - Query one prefix such as 8.8.8.0/24.
    - Keep announced ASN, holder, and resource.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://stat.ripe.net/data/prefix-overview/data.json",
          params={"resource": "8.8.8.0/24"},
          timeout=30,
      )
      response.raise_for_status()
      overview = pd.json_normalize(response.json()["data"])
      overview["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(overview)
  first_project:
    title: Look up a public DNS prefix
    goal: Test whether prefix-overview can power a bounded routing card.
    steps:
      - Confirm the response contains the queried resource and announced ASN list.
      - Record holder and ASN from the overview.
      - Explain that RIPEstat is a routing and registration view, not live packet data, and WHOIS can lag.
