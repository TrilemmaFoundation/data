getting_started:
  overview: >
    Ember publishes compiled country electricity statistics through a REST API.
    Start with yearly generation for one country and a few recent years. This is
    not a live grid feed — U.S. operations belong on EIA hourly data and EU
    transparency on ENTSO-E — and monthly coverage is limited to a subset of
    countries.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free Ember API key saved in the EMBER_API_KEY environment variable
  access_steps:
    - Register for a free Ember API key and save it in the EMBER_API_KEY environment variable.
    - Request yearly electricity generation for one country and a bounded start year.
    - Keep entity, series, date, and generation values with the retrieval timestamp.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.ember-energy.org/v1/electricity-generation/yearly",
          params={
              "entity_code": "USA",
              "is_aggregate_series": "false",
              "start_date": "2020",
              "api_key": os.environ["EMBER_API_KEY"],
          },
          timeout=30,
      )
      response.raise_for_status()
      generation = pd.json_normalize(response.json().get("data", response.json()))
      generation["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(generation.head(20))
  first_project:
    title: Compare U.S. and German Yearly Generation Mix
    goal: Test whether Ember yearly generation can power a bounded energy-transition comparison.
    steps:
      - Repeat the request for DEU and keep comparable series such as coal, gas, wind, and solar.
      - Chart share or TWh by series for the overlapping years.
      - Cite Ember under CC BY 4.0 and explain that yearly compiled statistics are not real-time grid operations.
