getting_started:
  overview: >
    Overpass returns live OSM features for a bounding box or named area. Start
    with one city bbox and a LIMIT, not a planet dump. Send a descriptive
    User-Agent. Results are volunteer-mapped, ODbL share-alike applies to
    derivative databases, and coverage varies by city.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the Overpass API wiki and the OpenStreetMap copyright page.
    - Write a QL query with a bounding box and a max number of features.
    - POST or GET the query with a descriptive User-Agent.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      query = """
      [out:json][timeout:25];
      node["amenity"="cafe"](40.74,-74.02,40.76,-73.99);
      out 20;
      """
      response = requests.get(
          "https://overpass-api.de/api/interpreter",
          params={"data": query},
          headers={
              "User-Agent": (
                  "TrilemmaDataCatalogExample/1.0 "
                  "(https://data.trilemma.foundation)"
              )
          },
          timeout=30,
      )
      response.raise_for_status()
      cafes = pd.json_normalize(response.json()["elements"])
      print(cafes.filter(regex="id|lat|lon|tags.name").head())
  first_project:
    title: List cafes inside a Manhattan bounding box
    goal: Test whether a bounded Overpass query can power a neighborhood amenity list.
    steps:
      - Keep OSM id, coordinates, and name for up to 20 cafes.
      - Count unnamed nodes instead of filling names from other maps.
      - Attribute OpenStreetMap contributors under ODbL and do not publish a planet extract from this guide.
