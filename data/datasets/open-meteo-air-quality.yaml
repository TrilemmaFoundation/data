getting_started:
  overview: >
    Start with one point and one day. The free Open-Meteo air-quality endpoint permits noncommercial use only;
    commercial services need separate paid access. It serves modeled CAMS
    air-quality context, not a direct station observation or health all-clear.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read Open-Meteo's noncommercial service terms and CAMS attribution guidance.
    - Request one point and one day of European AQI forecasts.
    - Preserve the model label and timestamps with displayed values.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://air-quality-api.open-meteo.com/v1/air-quality",
          params={"latitude": 52.52, "longitude": 13.41,
                  "hourly": "european_aqi", "forecast_days": 1},
          timeout=30,
      )
      response.raise_for_status()
      hourly = response.json()["hourly"]
      print(list(zip(hourly["time"], hourly["european_aqi"]))[:5])
  first_project:
    title: Inspect a Modeled AQI Day
    goal: Assess whether one forecast series supports noncommercial air-quality context.
    steps:
      - Keep the model source, units, and issue context with hourly values.
      - Inspect missing values before displaying an AQI badge.
      - Explain the noncommercial API limit and why modeled AQI is not a station reading.
