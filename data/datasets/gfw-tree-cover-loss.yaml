getting_started:
  overview: >
    Global Forest Watch exposes UMD/Hansen tree-cover loss through a SQL query
    API. Start with one year and the top countries by hectares lost. Loss is a
    stand-replacement disturbance, not a land-use class, and it includes fire,
    harvest, and conversion.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the GFW Data API documentation and locate the umd_tree_cover_loss dataset.
    - Query one loss year aggregated by ISO3 code with a small row limit.
    - Cite Hansen/UMD/Google/USGS/NASA and WRI when presenting results.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://data-api.globalforestwatch.org/dataset/umd_tree_cover_loss/latest/query",
          params={
              "sql": (
                  "SELECT iso, SUM(umd_tree_cover_loss__ha) AS loss_ha "
                  "FROM data WHERE umd_tree_cover_loss__year = 2023 "
                  "GROUP BY iso ORDER BY loss_ha DESC LIMIT 15"
              )
          },
          timeout=60,
      )
      response.raise_for_status()
      loss = pd.DataFrame(response.json()["data"])
      loss["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(loss)
  first_project:
    title: Rank countries by 2023 tree-cover loss
    goal: Test whether GFW country totals can power a bounded deforestation leaderboard.
    steps:
      - Confirm the query returned ISO3 codes and hectare totals for one loss year.
      - Rank the bounded result and note countries with missing or zero values.
      - Explain that tree-cover loss is not the same as deforestation of natural forest and includes harvest and fire.
