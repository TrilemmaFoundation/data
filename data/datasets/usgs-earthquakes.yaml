getting_started:
  overview: >
    The USGS Event Web Service provides current and historical earthquake
    records through bounded queries. Start with a recent seven-day window that
    is small enough to inspect in one notebook. Conclusions from that short,
    changing sample should not be treated as long-term seismic trends.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official API documentation and review its query parameters and limits.
    - Request GeoJSON for a recent seven-day window.
    - Record the seven-day query window and note when you ran the analysis.
  python:
    packages:
      - pandas
      - requests
    code: |
      from datetime import date, timedelta
      import pandas as pd
      import requests

      end = date.today()
      start = end - timedelta(days=7)
      response = requests.get(
          "https://earthquake.usgs.gov/fdsnws/event/1/query",
          params={"format": "geojson", "starttime": start, "endtime": end},
          timeout=30,
      )
      response.raise_for_status()
      earthquakes = pd.json_normalize(response.json()["features"])
      print(earthquakes[["properties.mag", "properties.place", "properties.time"]].head())
  first_project:
    title: Profile the past week's earthquakes
    goal: Describe where earthquakes were recorded during the last seven days and how their reported magnitudes were distributed.
    steps:
      - Convert event timestamps from milliseconds to UTC datetimes.
      - Plot the magnitude distribution and map events with magnitude 4 or greater.
      - Summarize the strongest reported event and explain why a seven-day sample cannot establish a long-term trend.
