getting_started:
  overview: >
    The USGS Event Web Service provides current and historical earthquake
    records through bounded queries. A recent seven-day window is small enough
    for a first notebook while still reflecting real operational data.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official API documentation and review the query limits.
    - Request GeoJSON for a recent bounded time window.
    - Preserve the response metadata and retrieval time with your analysis.
  python:
    packages:
      - pandas
      - requests
    code: |
      from datetime import date, timedelta
      import pandas as pd
      import requests

      end = date.today()
      start = end - timedelta(days=7)
      response = requests.get(
          "https://earthquake.usgs.gov/fdsnws/event/1/query",
          params={"format": "geojson", "starttime": start, "endtime": end},
          timeout=30,
      )
      response.raise_for_status()
      earthquakes = pd.json_normalize(response.json()["features"])
      print(earthquakes[["properties.mag", "properties.place", "properties.time"]].head())
  first_project:
    title: Profile the past week's earthquakes
    goal: Describe where and how strongly earthquakes occurred during the last seven days.
    steps:
      - Convert event timestamps from milliseconds to UTC datetimes.
      - Plot the magnitude distribution and map events with magnitude 4 or greater.
      - Summarize the strongest event and note the limits of a seven-day sample.
