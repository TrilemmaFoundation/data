id: computer-hardware
name: Computer Hardware
description: >
  Cycle time, memory, cache, channel counts, and relative performance for 209
  computer systems from multiple vendors.

url: https://archive.ics.uci.edu/dataset/29/computer+hardware
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Computing
  - Hardware
data_types:
  - Tabular
tasks:
  - Regression
  - Feature Analysis
difficulty: beginner
geography:
  - Not applicable
temporal_coverage: null
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Computer Hardware is a tiny performance table that makes regression features
    tangible. Its age also encourages discussion of whether historical data generalizes.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review each hardware abbreviation.
    - Install ucimlrepo, then run the example to fetch dataset ID 29.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      hardware = fetch_ucirepo(id=29)
      data = hardware.data.original
      print(data.head())
      print(data.describe(include="all"))
  first_project:
    title: Model relative CPU performance
    goal: Predict published performance from memory, cache, cycle, and channel fields.
    steps:
      - Inspect numeric ranges and decide how to handle vendor and model identifiers.
      - Fit a baseline regression model using only measurable hardware fields.
      - Report mean absolute error and discuss why the model should not rank modern systems.
