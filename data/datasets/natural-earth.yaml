getting_started:
  overview: >
    Natural Earth provides compact, public-domain layers designed for clear
    small-scale maps. Start with the 1:110m country boundaries to learn
    attributes, coordinate systems, and thematic mapping. These generalized
    boundaries are not authoritative for precise local or legal analysis.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A Python environment where GeoPandas and Matplotlib can be installed
  access_steps:
    - Open the official Natural Earth site and select the 1:110m Admin 0 Countries layer.
    - Download the layer and extract the shapefile beside your notebook.
  python:
    packages:
      - geopandas
      - matplotlib
    code: |
      import geopandas as gpd
      import matplotlib.pyplot as plt

      countries = gpd.read_file("ne_110m_admin_0_countries.shp")
      print(countries[["ADMIN", "CONTINENT", "geometry"]].head())
      countries.plot(column="CONTINENT", legend=True, figsize=(12, 6))
      plt.axis("off")
      plt.show()
  first_project:
    title: Compare world regions on one map
    goal: Build a continent map and explain how geometry and projection choices affect its interpretation.
    steps:
      - Inspect the layer's geometry type and coordinate reference system.
      - Check for missing continent or geometry values.
      - Create the map and explain how generalized boundaries and the chosen projection limit its use.
