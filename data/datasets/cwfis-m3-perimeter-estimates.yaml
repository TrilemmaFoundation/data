getting_started:
  overview: >
    The legacy CWFIS WFS serves public:m3polygons, an M3 perimeter-estimate
    layer distinct from reported incident points and authoritative evacuation
    boundaries. Start with three GeoJSON features and retain their estimated
    dates. NRCan's 2026 service placemat identifies this layer by name.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official CWFIS service catalogue and Canadian open licence.
    - Request three M3 polygon features from the named WFS layer.
    - Inspect estimate dates and geometry before rendering.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://cwfis.cfs.nrcan.gc.ca/geoserver/public/ows",
          params={"service": "WFS", "version": "2.0.0", "request": "GetFeature",
                  "typeNames": "public:m3polygons", "outputFormat": "application/json",
                  "srsName": "EPSG:4326", "count": 3}, timeout=30,
      )
      response.raise_for_status()
      for estimate in response.json()["features"][:3]:
          row = estimate["properties"]
          print(row.get("uid"), row.get("lastdate"), row.get("area"))
  first_project:
    title: Inspect Canadian M3 Footprints
    goal: Review three estimated fire footprints before map rendering.
    steps:
      - Keep polygon ID, estimate date, and stated area.
      - Compare footprint age with current incident reports.
      - Explain why an M3 estimate is not a surveyed perimeter or evacuation map.
