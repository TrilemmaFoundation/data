getting_started:
  overview: >
    The National Flood Hazard Layer publishes effective Flood Hazard Zones as a
    queryable map service. Start with one point or a tight county envelope and
    request a handful of zone attributes. A Special Flood Hazard Area flag is
    not a flood-insurance quote, a parcel determination, or a substitute for
    the Map Service Center product used in official rating.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the National Flood Hazard Layer page and note that Flood Hazard Zones are queryable as layer 28.
    - Query one latitude and longitude with a bounded result count and no geometry payload.
    - Record the flood zone, SFHA flag, and retrieval time before interpreting the result.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28/query",
          params={
              "geometry": "-96.7970,32.7767",
              "geometryType": "esriGeometryPoint",
              "inSR": 4326,
              "spatialRel": "esriSpatialRelIntersects",
              "outFields": "FLD_ZONE,ZONE_SUBTY,SFHA_TF",
              "returnGeometry": "false",
              "resultRecordCount": 5,
              "f": "json",
          },
          timeout=30,
      )
      response.raise_for_status()
      zones = pd.json_normalize(response.json().get("features", []))
      zones["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(zones.head())
  first_project:
    title: Look Up the Effective Flood Zone for One Address Point
    goal: Test whether a single geocoded point can power a bounded flood-risk screen.
    steps:
      - Query Flood Hazard Zones for one point and keep FLD_ZONE and SFHA_TF.
      - Label the result as SFHA or non-SFHA and note missing coverage when no feature returns.
      - State that NFHL zones are not insurance quotes and that unmapped communities need a Map Service Center check.
