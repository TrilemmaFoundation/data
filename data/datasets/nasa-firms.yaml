getting_started:
  overview: >
    FIRMS publishes frequently refreshed thermal-anomaly detections from Earth-
    observing satellites. Start with one sensor and one recent day before
    expanding the area or time window. Each point is a satellite detection, not
    confirmation of a fire on the ground.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free NASA FIRMS MAP_KEY saved in the NASA_FIRMS_MAP_KEY environment variable
  access_steps:
    - Request a free MAP_KEY from the official FIRMS API page.
    - Save the key in the NASA_FIRMS_MAP_KEY environment variable.
    - Run the example to retrieve the latest global VIIRS NOAA-20 detections.
  python:
    packages:
      - pandas
    code: |
      import os
      import pandas as pd

      map_key = os.environ["NASA_FIRMS_MAP_KEY"]
      url = (
          "https://firms.modaps.eosdis.nasa.gov/api/area/csv/"
          f"{map_key}/VIIRS_NOAA20_NRT/world/1"
      )
      fires = pd.read_csv(url)
      print(fires[["latitude", "longitude", "acq_date", "frp"]].head())
  first_project:
    title: Locate Today's Strongest Thermal Anomalies
    goal: Find where the latest day's highest-radiative-power detections cluster without treating them as confirmed fires.
    steps:
      - Convert acquisition date and time into one timestamp column.
      - Filter detections above the 90th percentile of fire radiative power.
      - Plot the remaining coordinates, describe the largest clusters, and state why detections require confirmation.
