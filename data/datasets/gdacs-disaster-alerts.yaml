getting_started:
  overview: >
    GDACS publishes multi-hazard alerts as a searchable GeoJSON event list.
    Start with one hazard type and a recent date window. Alerts are modeled
    impact estimates for humanitarian awareness; they are not official warnings
    and must not be used for decisions without national or scientific sources.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the GDACS homepage and note the requirement to acknowledge GDACS as the source.
    - Request the SEARCH event list for earthquakes in a bounded recent window.
    - Preserve event type, alert level, country, and retrieval time.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH",
          params={
              "eventlist": "EQ",
              "fromDate": "2026-07-01",
              "toDate": "2026-08-17",
              "alertlevel": "Orange;Red",
          },
          timeout=30,
      )
      response.raise_for_status()
      features = response.json().get("features", [])
      alerts = pd.json_normalize(features)
      alerts["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(alerts.head())
  first_project:
    title: List recent orange and red earthquake alerts
    goal: Test whether GDACS alert levels can power a bounded international hazard inbox.
    steps:
      - Keep event name, country, alert level, and dates from the GeoJSON properties.
      - Count alerts by country and flag any missing coordinates.
      - State that GDACS is not an official warning service and that each event needs the mandated national source.
