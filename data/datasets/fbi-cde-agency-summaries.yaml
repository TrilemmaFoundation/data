getting_started:
  overview: >
    The CDE's agency catalog and summarized agency/offense endpoint are distinct
    from the key-gated FBI state-estimates API. Start with one Rhode Island ORI
    and one offense family. Participation and suppression can make agency or
    county comparisons incomplete; a missing value is not zero crime.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the FBI CDE methodology and public-domain guidance.
    - Fetch a small state agency catalog and choose one ORI.
    - Inspect a dated offense summary and its reporting-population fields.
  python:
    packages: [requests]
    code: |
      import requests

      base = "https://cde.ucr.cjis.gov/LATEST"
      catalog = requests.get(f"{base}/agency/byStateAbbr/RI", timeout=20)
      catalog.raise_for_status()
      agency = catalog.json()["KENT"][0]
      summary = requests.get(
          f"{base}/summarized/agency/{agency['ori']}/violent-crime",
          params={"from": "01-2023", "to": "12-2025", "type": "totals"}, timeout=20,
      )
      summary.raise_for_status()
      series = next(iter(summary.json()["offenses"]["actuals"].values()))
      print(agency["ori"], agency["agency_name"], series.get("01-2025"))
  first_project:
    title: Inspect Agency Crime Coverage
    goal: Compare agency offense counts while retaining reporting coverage.
    steps:
      - Fetch one ORI and its dated violent-crime summary.
      - Inspect the corresponding population and submission fields.
      - Explain why voluntary reporting prevents treating null or suppressed counts as zero.
