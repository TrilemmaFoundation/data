getting_started:
  overview: >
    OSHA publishes employer severe-injury reports for amputations, inpatient
    hospitalizations, and losses of an eye. Start with a downloaded extract of
    the full SIR file and the first fifty rows. These records cover federal
    OSHA jurisdiction only and are not a complete injury census.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the Severe Injury Reports dashboard and read the federal-jurisdiction limitation.
    - Download the full SIR data set and save it as osha_severe_injury_reports.csv beside your notebook.
    - Inspect establishment, event date, and injury fields before summarizing.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      injuries = pd.read_csv("osha_severe_injury_reports.csv", nrows=50)
      injuries["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(injuries.head(20))
  first_project:
    title: Count Recent Severe Injuries in One Industry
    goal: Test whether SIR rows can power a bounded workplace-safety watch list.
    steps:
      - Keep event date, NAICS or industry, city, and hospitalization or amputation flags from the extract.
      - Count events in one industry and list establishments with more than one report.
      - Explain that state-plan states are missing and that narratives are not a complete injury census.
