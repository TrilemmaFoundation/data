getting_started:
  overview: >
    OpenFEMA publishes redacted NFIP claim records with occupancy, dates, and
    paid amounts. Start with one state and a recent year. Claims are insured
    losses, not a complete flood census, and redaction plus policy changes
    limit neighborhood-level conclusions.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A two-letter U.S. state code
  access_steps:
    - Read the OpenFEMA NFIP claims page and terms before querying.
    - Request a bounded v2 page for one state ordered by date of loss.
    - Keep occupancy, loss date, and building and contents payments.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.fema.gov/api/open/v2/FimaNfipClaims",
          params={
              "$filter": "state eq 'FL' and yearOfLoss eq 2024",
              "$select": "id,state,countyCode,yearOfLoss,dateOfLoss,occupancyType,amountPaidOnBuildingClaim,amountPaidOnContentsClaim",
              "$top": 100,
          },
          timeout=60,
      )
      response.raise_for_status()
      claims = pd.DataFrame(response.json()["FimaNfipClaims"])
      claims["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(claims.head())
  first_project:
    title: Summarize recent Florida NFIP claims
    goal: Test whether a bounded claims extract can power a county flood-loss sketch.
    steps:
      - Convert payment fields to numbers and drop rows missing loss dates.
      - Sum building and contents payments by county code for the selected year.
      - Explain that NFIP claims cover insured properties only and that redaction prevents household-level identification.
