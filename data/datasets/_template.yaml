# Copy this file to <dataset-id>.yaml and fill in every field.
# Filename (without .yaml) MUST match the `id` field.
# Do not add fields beyond those listed here.

id: example-dataset
name: Example Dataset
description: >
  One or two sentences describing what the dataset contains and why it is
  useful for data science projects.

url: https://example.com/dataset
access_type:
  - download
# Allowed values: download | api | both
api_key_required: false
free_to_access: true
# Must be true — paid datasets are not accepted.

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Biology
data_types:
  - Tabular
tasks:
  - Classification
difficulty: beginner
# Allowed values: beginner | intermediate | advanced

geography:
  - Not applicable
temporal_coverage: null
# Use a string like "1960-present" when applicable, otherwise null.
update_frequency: static
# Examples: static | annual | monthly | continuous

provider: Example Provider
source_type: academic
# Allowed values: government | academic | nonprofit | company | community
last_verified: 2026-08-10
# ISO date YYYY-MM-DD — update when you verify the source is still live.

getting_started:
  overview: >
    Explain in plain language why this dataset is a useful place to start.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official source using the link on the dataset page.
    - Download the CSV file and save it beside your notebook.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      data = pd.read_csv("example.csv")
      print(data.head())
  first_project:
    title: Explore the dataset
    goal: Write one sentence describing the question the learner will answer.
    steps:
      - Inspect the columns, data types, and missing values.
      - Create one useful summary or visualization.
      - Record one conclusion and one follow-up question.
