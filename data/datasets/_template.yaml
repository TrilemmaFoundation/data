# Copy this file to <dataset-id>.yaml and fill in every field.
# Filename (without .yaml) MUST match the `id` field.
# Do not add fields beyond those listed here.
# Metadata text and URLs must not contain control characters.

id: replace-with-dataset-id
name: Replace with dataset name
description: >
  Replace this with one concise sentence that states what the source contains
  and the practical microproduct use it could support.
theme: Environment & Hazards
# Allowed: Environment & Hazards | Government & Policy | Markets & Economics |
# Health, Food & Safety | Geospatial & Infrastructure | Research & Reference |
# Technology & Cybersecurity | Demographics & Development

url: https://example.com/dataset
access_type:
  - download
# Allowed values: download | api | both
# Use both by itself; otherwise list download and api separately.
api_key_required: false
free_to_access: true
# Must be true — paid datasets are not accepted.

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
license: Replace with the provider's data-use terms
license_url: https://example.com/data-terms
# Case-insensitive text that uniquely identifies the intended HTML pages.
url_checks:
  source_marker: Replace with source page marker
  license_marker: Replace with data-terms page marker

domains:
  - Replace with domain
data_types:
  - Replace with data type
tasks:
  - Replace with analysis task
difficulty: beginner
# Allowed values: beginner | intermediate | advanced

geography:
  - Not applicable
temporal_coverage: null
# Use a string like "1960-present" when applicable, otherwise null.
update_frequency: continuous
# Allowed: continuous | near real time | daily | weekly | monthly | quarterly | annual | occasional
# Static, archived, and discontinued datasets are not accepted.

provider: Replace with provider name
source_type: academic
# Allowed values: government | intergovernmental | academic | nonprofit | company | community
last_verified: YYYY-MM-DD
# ISO date YYYY-MM-DD — re-verify the source and guide at least every 90 days.

getting_started:
  overview: >
    Explain what the source provides, the smallest useful starting scope, and
    the main limitation a beginner must understand. Use direct, practical
    language and avoid unsupported claims.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Replace with one imperative action that opens or authenticates with the source.
    - Replace with one imperative action that retrieves a bounded sample.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      data = pd.read_csv("replace-with-filename.csv")
      print(data.head())
  first_project:
    title: Replace with a specific project title
    goal: Replace with one question that could validate a useful product signal.
    steps:
      - Replace with a concrete data preparation step.
      - Replace with a focused analysis or visualization step.
      - Replace with an interpretation step that states a limitation.
