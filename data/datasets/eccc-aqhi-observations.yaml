getting_started:
  overview: >
    ECCC's GeoMet collection exposes preliminary AQHI observations as
    GeoJSON. Start with five latest features, retaining their observation
    times and AQHI scale. AQHI is a Canadian health-risk index and is not
    interchangeable with a U.S. EPA AQI or an individual pollutant value.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official AQHI collection description and Canadian open licence.
    - Request five latest GeoJSON items in one call.
    - Inspect observation time, geometry, and AQHI property.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://api.weather.gc.ca/collections/aqhi-observations-realtime/items",
          params={"f": "json", "latest": "true", "limit": 5}, timeout=30,
      )
      response.raise_for_status()
      data = response.json()
      for item in data["features"][:5]:
          print(item["id"], item["properties"].get("aqhi"),
                item["properties"].get("observation_datetime"))
  first_project:
    title: Inspect Canadian AQHI Readings
    goal: Review five reported index features before local display.
    steps:
      - Keep feature ID, AQHI scale value, location, and observation time.
      - Check freshness and regional scope before matching a destination.
      - Explain why AQHI cannot be relabeled as U.S. AQI.
