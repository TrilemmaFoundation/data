getting_started:
  overview: >
    IMGW's public API returns river-stage measurements with official warning
    and alarm thresholds. Free access is limited to qualifying noncommercial
    analysis; commercial and specified sectoral uses can require a separate
    agreement and payment. Start with five stations from one response. A
    threshold crossing at one station is not a published area-wide warning.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read IMGW's current access regulation before reusing observations.
    - Fetch one current hydrology API response.
    - Inspect station ID, measurement time, stage, and warning threshold.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get("https://danepubliczne.imgw.pl/api/data/hydro/", timeout=30)
      response.raise_for_status()
      for station in response.json()[:5]:
          print(station.get("id_stacji"), station.get("stan_wody"),
                station.get("stan_ostrzegawczy"), station.get("stan_wody_data_pomiaru"))
  first_project:
    title: Inspect Polish River Thresholds
    goal: Review five official station readings before local stage matching.
    steps:
      - Keep station ID, river, reading time, units, and both thresholds.
      - Reject stale, missing, or malformed readings before comparison.
      - Explain why a station reading does not equal an official area warning.
