getting_started:
  overview: >
    Hospital General Information lists Medicare-registered hospitals with
    addresses, ownership, services, and overall ratings. Start with one state
    and the stable dataset identifier. Ratings may be absent or not comparable
    across facility types, and addresses are not a measure of service access.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the dataset overview and read the current data dictionary.
    - Query the stable dataset identifier for a bounded page of hospital records.
    - Preserve Facility ID values and the release date when comparing future versions.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://data.cms.gov/provider-data/api/1/datastore/query/xubh-q36u/0",
          params={"limit": 100},
          timeout=30,
      )
      response.raise_for_status()
      hospitals = pd.DataFrame(response.json()["results"])
      sample = hospitals[hospitals["state"] == "CA"]
      print(sample[["facility_id", "facility_name", "hospital_type", "hospital_overall_rating"]].head(20))
  first_project:
    title: Compare Hospitals within One State
    goal: Summarize hospital types, ownership, emergency services, and reported ratings in California.
    steps:
      - Filter records by state while preserving Facility ID as text.
      - Summarize hospital type and ownership and report rating missingness before comparing values.
      - Explain why facility type, missing ratings, release timing, and geographic access limit the comparison.
