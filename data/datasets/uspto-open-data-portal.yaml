id: uspto-open-data-portal
name: USPTO Open Data Portal
description: >
  U.S. patent bibliographic bulk files for building assignee, classification,
  and filing-volume research tools.
theme: Research & Reference
url: https://www.uspto.gov/learning-and-resources/data-and-statistics
access_type:
  - download
api_key_required: false
free_to_access: true
size_gb_min: 0.01
size_gb_max: 50
formats:
  - XML
  - ZIP
  - CSV
license: USPTO website terms of use
license_url: https://www.uspto.gov/terms-use-uspto-websites
url_checks:
  source_marker: Open Data Portal
  license_marker: Terms of Use
domains:
  - Research
