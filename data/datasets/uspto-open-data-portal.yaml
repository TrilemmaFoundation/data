getting_started:
  overview: >
    USPTO Open Data Portal replaced PatentsView for bibliographic search and
    bulk files. Start with a 25-record File Wrapper search using a free ODP
    API key. Weekly XML dumps are a separate bulk path, coverage is U.S.
    applications, and this is not the retired PatentsView API.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A USPTO.gov account with an ODP API key saved in USPTO_API_KEY
  access_steps:
    - Create a USPTO.gov account, complete the Open Data Portal profile fields, and save USPTO_API_KEY.
    - Open the Patent File Wrapper search endpoint documentation.
    - Request 25 utility applications and keep application number, title, and filing date.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.post(
          "https://api.uspto.gov/api/v1/patent/applications/search",
          headers={"X-API-KEY": os.environ["USPTO_API_KEY"]},
          json={
              "q": "applicationMetaData.applicationTypeLabelName:Utility",
              "pagination": {"offset": 0, "limit": 25},
          },
          timeout=30,
      )
      response.raise_for_status()
      payload = response.json()
      applications = pd.json_normalize(
          payload.get("patentFileWrapperDataBag", []),
      )
      applications["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(applications.head())
  first_project:
    title: List recent utility patent applications
    goal: Test whether File Wrapper search can power a bounded patent-title inbox.
    steps:
      - Keep application number, invention title, and filing date from the first page.
      - Count records missing a first applicant name.
      - Explain that ODP search is not PatentsView, a 25-record page is not a complete assignee census, and weekly XML dumps are a separate bulk download.
