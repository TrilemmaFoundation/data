getting_started:
  overview: >
    Energy Efficiency is a clean, compact table with eight inputs and two
    targets. It introduces multi-output regression without a large download.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the building parameters and targets.
    - Install ucimlrepo, then run the example to fetch dataset ID 242.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      efficiency = fetch_ucirepo(id=242)
      data = efficiency.data.original
      print(data.head())
      print(data.describe())
  first_project:
    title: Compare heating and cooling loads
    goal: Identify which building parameters are most related to both energy targets.
    steps:
      - Plot the distributions of heating and cooling load.
      - Calculate correlations between design inputs and both targets.
      - Fit two baseline regressors and compare their mean absolute errors.
