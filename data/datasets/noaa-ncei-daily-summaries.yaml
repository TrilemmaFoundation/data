getting_started:
  overview: >
    NCEI Daily Summaries provide weather observations aggregated by station and
    day. Start with one documented station, one calendar year, and a few named
    data types. Missing observations and quality attributes must be inspected
    before a threshold count is interpreted as a climate pattern.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Confirm the station identifier, period of record, units, and daily-summary data types.
    - Request one calendar year with station names and observation attributes included.
    - Parse numeric values and inspect missing dates and quality attributes before calculating thresholds.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.ncei.noaa.gov/access/services/data/v1",
          params={
              "dataset": "daily-summaries",
              "stations": "USW00094728",
              "startDate": "2025-01-01",
              "endDate": "2025-12-31",
              "dataTypes": "TMAX,TMIN,PRCP",
              "format": "json",
              "units": "standard",
              "includeAttributes": "true",
              "includeStationName": "true",
          },
          timeout=30,
      )
      response.raise_for_status()
      daily = pd.DataFrame(response.json())
      daily["DATE"] = pd.to_datetime(daily["DATE"])
      daily["TMAX"] = pd.to_numeric(daily["TMAX"], errors="coerce")
      hot_days = daily[daily["TMAX"] >= 90]
      hot_days = hot_days.assign(retrieved_at_utc=pd.Timestamp.now(tz="UTC"))
      print(hot_days[["DATE", "TMAX", "TMAX_ATTRIBUTES"]].head(20))
  first_project:
    title: Count Hot Days at One Weather Station
    goal: Count days with a maximum temperature of at least 90 degrees Fahrenheit at one station in 2025.
    steps:
      - Verify the station, standard-unit setting, calendar-year coverage, and temperature threshold.
      - Reindex to the full year and count qualifying days only after identifying missing TMAX observations and quality attributes.
      - Explain why one station, missing observations, quality flags, and a single year do not establish a regional or long-term climate trend.
