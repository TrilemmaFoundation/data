id: spambase
name: Spambase
description: >
  Word, character, and capital-letter frequency features from emails labeled
  as spam or not spam.

url: https://archive.ics.uci.edu/dataset/94/spambase
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Cybersecurity
  - Email
data_types:
  - Tabular
  - Text Features
tasks:
  - Classification
  - Feature Analysis
difficulty: intermediate
geography:
  - United States
temporal_coverage: null
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Spambase provides already-engineered numeric features, so learners can study
    classification and thresholds without first building a text-processing pipeline.
  prerequisites:
    - Python 3.10 or newer
    - Basic familiarity with binary classification metrics
  access_steps:
    - Open the official UCI page and read how the personalized email sample was created.
    - Install ucimlrepo, then run the example to fetch dataset ID 94.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      spam = fetch_ucirepo(id=94)
      data = spam.data.original
      print(data.head())
      print(spam.data.targets.value_counts(normalize=True))
  first_project:
    title: Tune a spam-filter threshold
    goal: Compare the cost of missed spam with the cost of blocking legitimate mail.
    steps:
      - Inspect the class balance and the most variable frequency features.
      - Train a probabilistic classifier and calculate precision and recall.
      - Compare three decision thresholds and explain which tradeoff you would choose.
