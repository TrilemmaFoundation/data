getting_started:
  overview: >
    Bitview serves BRK's Bitcoin network series through a free, no-key API.
    Start with seven daily supply values rather than the full catalog. The
    supply series measures bitcoin in unspent outputs, not coins available for
    immediate spending; raw values also need their index to be dated correctly.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Open the Bitview API documentation and inspect the Series endpoints.
    - Check the supply series metadata for its definition and day1 index.
    - Request only the last seven day1 values before expanding the range.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://bitview.space/api/series/supply/day1/data",
          params={"start": -7},
          headers={"User-Agent": "Trilemma Data guide (https://data.trilemma.foundation)"},
          timeout=20,
      )
      response.raise_for_status()
      supply_btc = response.json()
      print(f"{len(supply_btc)} recent daily supply values (BTC):")
      print(supply_btc)
  first_project:
    title: Track Bitcoin Supply across Seven Daily Samples
    goal: Test whether a short supply series can support a network-trend dashboard.
    steps:
      - Fetch seven daily supply values and confirm their count.
      - Compare the first and last values in BTC, and plot them by sample order.
      - Explain that UTXO supply is not spendable float and the raw array needs a verified day1 index before labeling dates.
