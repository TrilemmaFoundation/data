getting_started:
  overview: >
    The 2024 table-based Summary File publishes each detailed table as a pipe-delimited
    .dat file with estimates and margins. HouseHunter pins B25034, B25035, B25103,
    B25077, and B08303. Start with one bounded read of B25103; a table value is a
    survey estimate, and a GEO_ID must be joined to its geography label.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the Census table-based Summary File instructions and citation guidance.
    - Request the first complete records from one pinned 2024 five-year table.
    - Inspect the GEO_ID, estimate, and margin fields before a geography join.
  python:
    packages: [requests]
    code: |
      import csv
      import io
      import requests

      url = ("https://www2.census.gov/programs-surveys/acs/summary_file/2024/"
             "table-based-SF/data/5YRData/acsdt5y2024-b25103.dat")
      response = requests.get(url, headers={"Range": "bytes=0-2047"}, timeout=30)
      response.raise_for_status()
      lines = response.text.splitlines()
      rows = csv.DictReader(io.StringIO("\n".join(lines[:-1])), delimiter="|")
      for row in list(rows)[:2]:
          print(row["GEO_ID"], row["B25103_E001"], row["B25103_M001"])
  first_project:
    title: Inspect ACS Housing Estimates
    goal: Compare a small set of housing estimates with their margins of error.
    steps:
      - Read B25103 estimates and margins for two geographies.
      - Join GEO_ID to the matching ACS geography labels.
      - Explain why a five-year survey estimate is not a current property count.
