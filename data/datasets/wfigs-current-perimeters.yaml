getting_started:
  overview: >
    WFIGS publishes a separate current perimeter layer for agency-reported
    wildfire footprints. Start with three bounded feature records and keep
    polygon date and incident name. Perimeters can lag a moving fire and are
    not evacuation or legal boundary maps.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the perimeter item's official notice and update context.
    - Query three current perimeter records from its feature layer.
    - Inspect polygon date and incident identity before mapping.
  python:
    packages:
      - requests
    code: |
      import requests

      url = ("https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/"
             "WFIGS_Interagency_Perimeters_Current/FeatureServer/0/query")
      response = requests.get(
          url, params={"where": "attr_IncidentTypeCategory='WF'", "outFields": "OBJECTID,poly_IncidentName,poly_PolygonDateTime",
                       "returnGeometry": "false", "resultRecordCount": 3, "f": "json"}, timeout=30,
      )
      response.raise_for_status()
      for feature in response.json()["features"][:3]:
          row = feature["attributes"]
          print(row["OBJECTID"], row["poly_IncidentName"], row["poly_PolygonDateTime"])
  first_project:
    title: Inspect Current U.S. Fire Perimeters
    goal: Review three reported fire polygons before map rendering.
    steps:
      - Keep object ID, polygon date, incident association, and attribution.
      - Filter prescribed or superseded features when building a current map.
      - Explain why a perimeter does not establish evacuation status.
