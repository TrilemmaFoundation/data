getting_started:
  overview: >
    WorldPop REST metadata lists per-country population rasters. Start with one
    ISO3 code and the unconstrained 2000-2020 series, not the global mosaic.
    Grid values are modeled estimates, not a census count, and some derived
    layers use a different share-alike licence.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the REST API basics and the CC BY 4.0 licence text.
    - Request metadata for one country instead of downloading a continental mosaic.
    - Keep ISO3, year, DOI, and the published file URL.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.worldpop.org/rest/data/pop/wpgp",
          params={"iso3": "LUX"},
          timeout=30,
      )
      response.raise_for_status()
      layers = pd.DataFrame(response.json()["data"])
      sample = layers[layers["popyear"].astype(str) == "2020"]
      print(sample[["iso3", "popyear", "doi", "data_format", "files"]].head())
  first_project:
    title: List Luxembourg's 2020 WorldPop raster metadata
    goal: Test whether REST metadata can locate one country unconstrained population file.
    steps:
      - Keep ISO3, year, DOI, and the published GeoTIFF path for 2020.
      - Confirm the file is a country raster rather than a global mosaic.
      - Cite WorldPop under CC BY 4.0 and explain that pixel counts are modeled estimates, not census enumerations.
