id: abalone
name: Abalone
description: >
  Physical measurements of abalone shells used to estimate age from the number
  of growth rings, suitable for introductory regression and feature analysis.

url: https://archive.ics.uci.edu/dataset/1/abalone
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Biology
  - Ecology
data_types:
  - Tabular
tasks:
  - Regression
  - Feature Engineering
difficulty: beginner
geography:
  - Tasmania
temporal_coverage: null
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Abalone is a small table with understandable physical measurements and one
    numeric target. It is a friendly first regression dataset with no missing values.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the variables and license.
    - Install ucimlrepo, then run the example to fetch dataset ID 1.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      abalone = fetch_ucirepo(id=1)
      data = abalone.data.original
      print(data.head())
      print(data.describe(include="all"))
  first_project:
    title: Estimate abalone age
    goal: Explore which shell measurements are most closely related to ring count.
    steps:
      - Inspect distributions and confirm that the table has no missing values.
      - Compare each numeric feature with the Rings target using correlations and plots.
      - Fit a baseline regression model and report its mean absolute error.
