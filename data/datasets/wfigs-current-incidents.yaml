getting_started:
  overview: >
    WFIGS publishes a current incident-point layer derived from agency fire
    reports. Start with three features from the public ArcGIS layer. Incident
    locations are approximate, dynamic, and not legal boundaries; cite NIFC
    and contributing agencies and keep the update timestamp.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the exact ArcGIS item and its item-specific use notice.
    - Query three current incident records from the feature layer.
    - Inspect incident name, size, and modification time.
  python:
    packages:
      - requests
    code: |
      import requests

      url = ("https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/"
             "WFIGS_Incident_Locations_Current/FeatureServer/0/query")
      response = requests.get(
          url, params={"where": "IncidentTypeCategory='WF'", "outFields": "OBJECTID,IrwinID,IncidentName,IncidentSize,ModifiedOnDateTime_dt",
                       "returnGeometry": "false", "resultRecordCount": 3, "f": "json"}, timeout=30,
      )
      response.raise_for_status()
      for feature in response.json()["features"][:3]:
          row = feature["attributes"]
          print(row["IrwinID"], row["IncidentName"], row["ModifiedOnDateTime_dt"])
  first_project:
    title: Inspect Current U.S. Wildfire Points
    goal: Review three agency incidents before mapping wildfire context.
    steps:
      - Keep the IRWIN ID, incident type, update time, and source agency.
      - Check freshness and exclude prescribed fires when needed.
      - Explain why a point does not identify a smoke plume's origin.
