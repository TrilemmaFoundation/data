getting_started:
  overview: >
    OpenAlex indexes scholarly works and links them to authors, institutions,
    venues, topics, and citations. Start with one clear research query, a
    30-day publication window, and a single result page; the full public
    snapshot is hundreds of gigabytes. Citation counts lag, source coverage
    varies, and author, institution, and topic disambiguation is imperfect.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An OpenAlex API key saved in the OPENALEX_API_KEY environment variable
  access_steps:
    - Create a free OpenAlex API key and save it in the OPENALEX_API_KEY environment variable.
    - Choose a specific research query and set a bounded publication-date filter.
    - Request only needed fields, retain OpenAlex IDs, and record the retrieval timestamp.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      from datetime import date, timedelta
      import pandas as pd
      import requests

      start = date.today() - timedelta(days=30)
      response = requests.get(
          "https://api.openalex.org/works",
          params={
              "api_key": os.environ["OPENALEX_API_KEY"],
              "search": "wildfire risk",
              "filter": f"from_publication_date:{start.isoformat()}",
              "sort": "publication_date:desc",
              "per_page": 100,
              "select": "id,display_name,publication_date,cited_by_count,primary_topic,authorships",
          },
          timeout=30,
      )
      response.raise_for_status()
      works = pd.json_normalize(response.json()["results"])
      works["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(works[["id", "display_name", "publication_date", "cited_by_count", "primary_topic.display_name"]].head(20))
  first_project:
    title: Track Recent Work on One Research Topic
    goal: Identify newly indexed works about wildfire risk published during the last 30 days.
    steps:
      - Review the query and publication-date filter and retain stable OpenAlex IDs for deduplication.
      - Summarize recent works by publication date and primary topic without treating citation count as immediate impact.
      - Explain how indexing delay, source coverage, citation lag, and imperfect author, institution, and topic disambiguation limit the monitor.
