getting_started:
  overview: >
    The Sea Ice Index provides daily and monthly Northern Hemisphere extent
    CSV files derived from passive-microwave satellite retrievals. Start with
    the monthly North CSV. Extent is a thresholded ice-covered area, not ice
    thickness or volume, and near-real-time values can be revised.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the G02135 dataset page and locate the Sea Ice Index CSV archives.
    - Download the Northern Hemisphere monthly extent file.
    - Keep date, extent, and missing flags before plotting.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      ice = pd.read_csv(
          "https://noaadata.apps.nsidc.org/NOAA/G02135/north/monthly/data/N_09_extent_v3.0.csv",
      )
      ice.columns = [column.strip() for column in ice.columns]
      ice["extent"] = pd.to_numeric(ice["extent"], errors="coerce")
      ice["date"] = pd.to_datetime(
          dict(year=ice["year"], month=ice["mo"], day=1)
      )
      print(ice[["date", "extent", "area"]].tail())
  first_project:
    title: Track September Arctic sea-ice extent
    goal: Describe how September Northern Hemisphere extent has changed across the published record.
    steps:
      - Convert year and month to dates and drop rows with missing extent.
      - Plot September extent and mark the minimum year in the extract.
      - Explain that extent is not thickness or volume and that near-real-time months can be revised.
