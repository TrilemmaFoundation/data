id: auto-mpg
name: Auto MPG
description: >
  Vehicle attributes such as cylinders, horsepower, weight, and model year for
  predicting city-cycle fuel economy.

url: https://archive.ics.uci.edu/dataset/9/auto+mpg
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Transportation
  - Energy
data_types:
  - Tabular
tasks:
  - Regression
  - Visualization
difficulty: beginner
geography:
  - United States
  - Europe
  - Japan
temporal_coverage: 1970-1982
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Auto MPG is a compact regression classic with intuitive vehicle features,
    a time dimension, and a small amount of missing horsepower data.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the feature and origin definitions.
    - Install ucimlrepo, then run the example to fetch dataset ID 9.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      cars = fetch_ucirepo(id=9)
      data = cars.data.original
      print(data.head())
      print(data.isna().sum())
  first_project:
    title: Explain fuel-economy changes
    goal: Separate the relationships of vehicle weight and model year with fuel economy.
    steps:
      - Clean missing horsepower values and inspect the MPG distribution.
      - Plot MPG against weight, horsepower, and model year.
      - Fit a baseline regression model and explain its largest residuals.
