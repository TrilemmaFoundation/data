id: car-evaluation
name: Car Evaluation
description: >
  Categorical car acceptability examples derived from a hierarchical decision
  model using price, capacity, luggage space, and safety attributes.

url: https://archive.ics.uci.edu/dataset/19/car+evaluation
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Transportation
  - Decision Science
data_types:
  - Tabular
  - Categorical
tasks:
  - Classification
  - Decision Modeling
difficulty: beginner
geography:
  - Not applicable
temporal_coverage: null
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Car Evaluation is a tiny all-categorical table that is useful for learning
    frequency tables, one-hot encoding, and multiclass classification.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the six input attributes.
    - Install ucimlrepo, then run the example to fetch dataset ID 19.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      cars = fetch_ucirepo(id=19)
      data = cars.data.original
      print(data.head())
      print(cars.data.targets.value_counts())
  first_project:
    title: Explain car acceptability
    goal: Discover which categorical attributes best separate the four ratings.
    steps:
      - Create frequency tables for every feature and the target.
      - Compare acceptability rates across safety and passenger-capacity values.
      - Train a decision tree and translate its first splits into plain language.
