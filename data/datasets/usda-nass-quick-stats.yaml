getting_started:
  overview: >
    Quick Stats exposes published NASS survey and census estimates. Start with
    one commodity, one state, one statistic, and one year so the request stays
    under the 50,000-row cap. Display the required NASS disclaimer, and do not
    treat a single-year extract as a complete national inventory.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free NASS API key saved in the NASS_API_KEY environment variable
  access_steps:
    - Register for a NASS API key and save it in the NASS_API_KEY environment variable.
    - Use get_counts to confirm a commodity-state-year query is under 50,000 rows.
    - Request JSON for that bounded query and record the short_desc and unit.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      params = {
          "key": os.environ["NASS_API_KEY"],
          "commodity_desc": "CORN",
          "statisticcat_desc": "YIELD",
          "agg_level_desc": "STATE",
          "state_alpha": "IA",
          "year": 2024,
          "format": "JSON",
      }
      response = requests.get(
          "https://quickstats.nass.usda.gov/api/api_GET/",
          params=params,
          timeout=30,
      )
      response.raise_for_status()
      estimates = pd.DataFrame(response.json()["data"])
      estimates["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(estimates[["short_desc", "state_alpha", "year", "Value", "unit_desc"]].head(20))
  first_project:
    title: Look Up One State's Corn Yield
    goal: Retrieve published Iowa corn-yield estimates for one year and record their units.
    steps:
      - Confirm the API returned yield rows for the selected commodity, state, and year.
      - Note the unit_desc and whether the Value is a number or a suppression code.
      - Display that the product uses the NASS API but is not endorsed or certified by NASS, and do not treat one state-year extract as a national production total.
