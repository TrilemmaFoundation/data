getting_started:
  overview: >
    IPMA publishes area-based weather warnings as JSON. Start with five entries
    and preserve area code, start/end time, and awareness level. The public
    service is documented for noncommercial use; confirm the IPMA conditions
    before wider reuse. Green entries are not proof of no other hazards.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read IPMA's API documentation and linked conditions of use.
    - Fetch the current warning JSON once.
    - Inspect each warning's area code and validity window.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json",
          timeout=30,
      )
      response.raise_for_status()
      for warning in response.json()[:5]:
          print(warning["idAreaAviso"], warning["awarenessLevelID"],
                warning["startTime"], warning["endTime"])
  first_project:
    title: Inspect Five IPMA Warnings
    goal: Check whether IPMA warnings can support a bounded area warning card.
    steps:
      - Keep official area IDs and the full validity interval.
      - Treat each category and severity separately before displaying it.
      - Explain IPMA's noncommercial-use limit and why these entries do not imply a local all-clear.
