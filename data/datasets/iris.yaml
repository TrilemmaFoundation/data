getting_started:
  overview: >
    Iris is a tiny, tidy table with four numeric measurements and one target
    label. It is ideal for learning inspection, visualization, and a first
    classification workflow without spending time cleaning a large file.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI source and download the dataset archive.
    - Extract the archive and place iris.data beside your notebook.
  python:
    packages:
      - pandas
      - seaborn
    code: |
      import pandas as pd
      import seaborn as sns

      columns = ["sepal_length", "sepal_width", "petal_length", "petal_width", "species"]
      iris = pd.read_csv("iris.data", names=columns)
      print(iris.head())
      print(iris.groupby("species").mean(numeric_only=True))
      sns.pairplot(iris, hue="species")
  first_project:
    title: Compare the three iris species
    goal: Find which flower measurements most clearly separate the species.
    steps:
      - Check the column names, data types, and missing values.
      - Compare the average measurements for each species.
      - Plot pairs of measurements and note which species overlap.
