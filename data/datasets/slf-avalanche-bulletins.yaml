getting_started:
  overview: The official WSL Institute for Snow and Avalanche Research SLF feed supports regional hazard
    context. Start with two archived January 2026 bulletin regions; an archived bulletin is not a current
    avalanche warning and off-season responses can be empty.
  prerequisites:
  - Python 3.10 or newer
  - An internet connection
  - The requests Python package
  access_steps:
  - Read the official feed documentation and reuse terms.
  - Fetch one bounded official response.
  - Inspect two records and retain their validity period.
  python:
    packages:
    - requests
    code: |
      import requests

      url = "https://aws.slf.ch/api/bulletin/caaml/v4/en/geojson"
      response = requests.get(url, params={"activeAt": "2026-01-11T11:30:00Z"}, timeout=20)
      response.raise_for_status()
      for region in response.json()["features"][:2]:
          props = region["properties"]
          print(props.get("bulletinID"), props.get("validTime"))
  first_project:
    title: Map Dated Regional Warnings
    goal: Inspect two archived January 2026 bulletin regions with official validity and source links.
    steps:
    - Fetch one official response and retain its issue time.
    - Display two region or river records with their source links.
    - Explain why coverage and validity cannot be inferred beyond the named area.
