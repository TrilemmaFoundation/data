getting_started:
  overview: >
    The NPPES Read API returns FOIA-disclosable National Provider Identifier
    records. Start with API version 2.1 and a city-plus-state query. An NPI
    does not mean the provider is licensed or credentialed, and older API
    versions are retired.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the NPPES API page and confirm you will call version 2.1.
    - Query one city and state with a small limit.
    - Record that issuance of an NPI does not validate licensure or credentialing.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://npiregistry.cms.hhs.gov/api/",
          params={
              "version": "2.1",
              "city": "Baltimore",
              "state": "MD",
              "limit": 10,
          },
          timeout=30,
      )
      response.raise_for_status()
      results = pd.json_normalize(response.json().get("results", []))
      results["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(results.head(10))
  first_project:
    title: Map Public NPIs in One City
    goal: List a bounded set of Baltimore providers and their primary taxonomies from the v2.1 registry.
    steps:
      - Confirm the response used version 2.1 and returned basic provider names and addresses.
      - Extract primary taxonomy descriptions and count them.
      - State that an NPI does not establish that the provider is licensed, credentialed, or currently practicing at the listed address.
