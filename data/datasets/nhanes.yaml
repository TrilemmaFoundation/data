getting_started:
  overview: >
    NHANES public files include demographics, examination, and lab tables by
    cycle. Start with one cycle's demographics XPT. Unweighted row counts are
    not national estimates; use interview weights, and do not treat a cycle
    extract as clinical diagnosis data.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the NHANES page and choose one public cycle such as 2021-2023.
    - Download the demographics XPT file.
    - Keep sequence number, interview weight, age, and sex.
  python:
    packages:
      - pandas
      - pyreadstat
      - requests
    code: |
      import pandas as pd
      import pyreadstat
      import requests
      from io import BytesIO

      response = requests.get(
          "https://wwwn.cdc.gov/Nchs/Nhanes/2021-2023/DEMO_L.xpt",
          timeout=60,
      )
      response.raise_for_status()
      demographics, _meta = pyreadstat.read_xport(BytesIO(response.content))
      print(demographics.head())
  first_project:
    title: Describe one NHANES demographics file
    goal: Test whether a public cycle file can power a bounded survey-profile sketch.
    steps:
      - Keep sequence number, interview weight, age, and sex from the demographics table.
      - Compare unweighted counts with a weighted age summary using the interview weight.
      - Explain that unweighted rows are not U.S. prevalence estimates and that NHANES is not a diagnostic file.
