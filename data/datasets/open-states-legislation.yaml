getting_started:
  overview: >
    Open States API v3 returns bills and legislators for U.S. states. Start with
    one jurisdiction and a small page of recent bills. Coverage and scrape lag
    vary by state, and this feed is not the enrolled text of record.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free Open States API key saved in the OPENSTATES_API_KEY environment variable
  access_steps:
    - Create an Open States account and request an API key.
    - Save the key in the OPENSTATES_API_KEY environment variable.
    - Request one jurisdiction's bills with a small page size.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://v3.openstates.org/bills",
          params={
              "jurisdiction": "Colorado",
              "sort": "updated_desc",
              "per_page": 10,
              "page": 1,
          },
          headers={"X-API-KEY": os.environ["OPENSTATES_API_KEY"]},
          timeout=30,
      )
      response.raise_for_status()
      bills = pd.json_normalize(response.json()["results"])
      bills["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(bills[["identifier", "title", "latest_action_date"]].head(10))
  first_project:
    title: Watch Recently Updated Bills in One State
    goal: Test whether a ten-bill extract can power a focused state-policy inbox.
    steps:
      - Keep bill identifiers, titles, and latest action dates for Colorado.
      - Group bills by latest action date and flag missing titles.
      - Explain that scrape lag and jurisdiction coverage mean this is not the legislature's official record.
