getting_started:
  overview: >
    EFFIS filters FIRMS thermal detections into its all.hs active-fire WMS layer.
    Start with a small map tile; a hotspot may be another heat source and is not a confirmed perimeter.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read EFFIS's detection methodology and credit both EFFIS and FIRMS.
    - Request a small all.hs image from the public WMS.
    - Keep sensor, time, and false-positive limits visible when interpreting hotspots.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://maps.effis.emergency.copernicus.eu/effis",
          params={"SERVICE": "WMS", "VERSION": "1.1.1", "REQUEST": "GetMap",
                  "LAYERS": "all.hs", "STYLES": "default", "SRS": "EPSG:4326",
                  "BBOX": "5,45,6,46", "WIDTH": 32, "HEIGHT": 32,
                  "FORMAT": "image/tiff"},
          timeout=25,
      )
      response.raise_for_status()
      assert response.content[:4] in (b"II*\x00", b"MM\x00*"), "Expected GeoTIFF"
      print("EFFIS hotspot GeoTIFF bytes:", len(response.content))
  first_project:
    title: Inspect an Active-Fire Layer
    goal: Display a bounded thermal-detection tile as discovery context.
    steps:
      - Fetch one all.hs WMS tile.
      - Label the geographic bounds and EFFIS/FIRMS attribution.
      - Explain detection delays and why a thermal anomaly is not a verified wildfire.
