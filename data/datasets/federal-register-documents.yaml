getting_started:
  overview: >
    The Federal Register API exposes metadata and links for rules, proposed
    rules, notices, and presidential documents. Start with a bounded page from
    one agency and retain each official PDF link. FederalRegister.gov is an
    informational rendition, so legal research and deadlines must be verified
    against the official edition on GovInfo.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An agency slug from the Federal Register agency directory
  access_steps:
    - Read the API documentation and select one agency slug.
    - Request a bounded page ordered by newest publication date.
    - Retain the document number and GovInfo PDF URL for authoritative verification.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.federalregister.gov/api/v1/documents.json",
          params={
              "conditions[agencies][]": "environmental-protection-agency",
              "order": "newest",
              "per_page": 20,
          },
          timeout=30,
      )
      response.raise_for_status()
      documents = pd.DataFrame(response.json()["results"])
      documents["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(documents[["publication_date", "type", "title", "pdf_url"]].head())
  first_project:
    title: Monitor one agency's new publications
    goal: Identify the latest rules, proposed rules, and notices published by one agency.
    steps:
      - Request the newest documents and group them by document type.
      - Flag titles containing a narrow topic phrase and retain their document numbers and official PDF links.
      - Verify one result on GovInfo and explain why the API rendition alone should not determine legal obligations or deadlines.
