getting_started:
  overview: >
    The National Map stages 3DEP one arc-second GeoTIFF tiles, including historical versions pinned by HouseHunter.
    Start with one small coastal tile; a bare raster value cannot be interpreted without no-data, unit, and datum metadata.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests and rasterio Python packages]
  access_steps:
    - Review the official 3DEP resolution and vertical-datum documentation.
    - Download one pinned one arc-second GeoTIFF tile.
    - Inspect its bounds, no-data value, and a small overview before comparing terrain.
  python:
    packages: [requests, rasterio]
    code: |
      import requests
      from rasterio.io import MemoryFile

      url = "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/historical/n32w081/USGS_1_n32w081_20220725.tif"
      response = requests.get(url, timeout=35)
      response.raise_for_status()
      with MemoryFile(response.content) as memory:
          with memory.open() as tile:
              overview = tile.read(1, out_shape=(36, 36), masked=True)
              print(tile.bounds, tile.nodata, float(overview.min()), float(overview.max()))
  first_project:
    title: Inspect One Elevation Tile
    goal: Show a tile's geographic bounds and the range of sampled elevation values.
    steps:
      - Download one small official 3DEP GeoTIFF.
      - Display its bounds, no-data marker, and overview value range.
      - Explain why different vintages and vertical references must be reconciled before comparison.
