getting_started:
  overview: >
    Start with one assessment year and a small API page of parcels. Historical
    files omit some zoning and previous-value fields, and assessment values are
    not the same as taxable values.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official dataset page and review the notes for the selected assessment year.
    - Query a bounded page through the OpenDataSoft API.
    - Keep the report year, parcel identifier, values, levy, and zoning fields.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      url = "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/property-tax-report/records"
      response = requests.get(url, params={"limit": 100}, timeout=30)
      response.raise_for_status()
      properties = pd.json_normalize(response.json()["results"])
      columns = [
          "pid",
          "tax_assessment_year",
          "current_land_value",
          "current_improvement_value",
          "tax_levy",
          "zoning_district",
      ]
      print(properties[columns].head())
  first_project:
    title: Compare Land and Improvement Values
    goal: Test whether one assessment year can support a parcel-level redevelopment signal.
    steps:
      - Filter the sample to records with parcel identifiers and both current value fields.
      - Calculate land value as a share of total assessed value.
      - Explain why assessment timing, missing historical fields, and taxable-value rules limit comparisons.
