id: human-activity-recognition
name: Human Activity Recognition Using Smartphones
description: >
  Smartphone accelerometer and gyroscope recordings labeled with six common
  human activities, useful for classification and feature engineering.

url: https://archive.ics.uci.edu/ml/datasets/human%2Bactivity%2Brecognition%2Busing%2Bsmartphones
access_type:
  - download
api_key_required: false
free_to_access: true

size_gb_min: 0.05
size_gb_max: 0.1
formats:
  - CSV
  - TXT

license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Health
  - Mobile Sensing

data_types:
  - Time Series
  - Sensor

tasks:
  - Classification
  - Feature Engineering

difficulty: intermediate

geography:
  - Not applicable

temporal_coverage: null
update_frequency: static

provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    This dataset introduces realistic sensor features while remaining small
    enough for a laptop. The prepared train and test files let you focus on
    classification rather than raw signal processing.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - Basic familiarity with rows, columns, and classification labels
  access_steps:
    - Open the official UCI source and download the dataset archive.
    - Extract the download, then extract the nested UCI HAR Dataset.zip beside your notebook.
  python:
    packages:
      - pandas
      - scikit-learn
    code: |
      import pandas as pd

      root = "UCI HAR Dataset"
      features = pd.read_csv(f"{root}/features.txt", sep=r"\s+", header=None)[1]
      X_train = pd.read_csv(f"{root}/train/X_train.txt", sep=r"\s+", header=None)
      y_train = pd.read_csv(f"{root}/train/y_train.txt", header=None, names=["activity"])
      X_train.columns = features

      print(X_train.shape)
      print(y_train["activity"].value_counts().sort_index())
  first_project:
    title: Classify everyday activities
    goal: Build a baseline model that predicts the recorded activity from sensor features.
    steps:
      - Map the numeric activity labels using activity_labels.txt.
      - Train a simple logistic regression or random forest classifier.
      - Report accuracy and inspect which activities are most often confused.
