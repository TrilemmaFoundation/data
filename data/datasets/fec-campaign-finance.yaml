getting_started:
  overview: >
    The OpenFEC API exposes candidate and committee financial totals from FEC
    reports. Start with active House candidate totals for one cycle, sorted by
    receipts. Do not build products from individual contributor lists; FEC law
    prohibits selling or using that information to solicit donations or for
    commercial purposes.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free api.data.gov key saved in the DATA_GOV_API_KEY environment variable
  access_steps:
    - Register for a free api.data.gov key and save it in the DATA_GOV_API_KEY environment variable.
    - Read the FEC sale-or-use restriction before choosing any contributor endpoint.
    - Request a bounded page of candidate totals for one office and cycle.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.open.fec.gov/v1/candidates/totals/",
          params={
              "api_key": os.environ["DATA_GOV_API_KEY"],
              "cycle": 2024,
              "office": "H",
              "is_active_candidate": "true",
              "sort": "-receipts",
              "per_page": 20,
          },
          timeout=30,
      )
      response.raise_for_status()
      totals = pd.DataFrame(response.json()["results"])
      totals["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(totals[["name", "party_full", "state", "receipts", "disbursements"]].head(20))
  first_project:
    title: Rank House Candidates by Reported Receipts
    goal: Identify which active House candidates reported the largest receipts in one election cycle.
    steps:
      - Confirm the totals endpoint returned committee-level receipts and disbursements, not contributor names.
      - Rank the bounded page by receipts and compare disbursements for the same candidates.
      - State that individual contributor information from FEC reports cannot be sold or used to solicit donations or for commercial purposes.
