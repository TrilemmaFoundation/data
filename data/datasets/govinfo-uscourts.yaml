getting_started:
  overview: >
    GovInfo's USCOURTS collection hosts published federal opinions. Start with
    one court package id through the API. Coverage is not every federal case,
    unpublished opinions are often missing, and the collection is not a
    citator.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free api.data.gov key saved in the DATA_GOV_API_KEY environment variable
  access_steps:
    - Register for a free api.data.gov key and save it in DATA_GOV_API_KEY.
    - Open the USCOURTS collection page and copy one court collection code.
    - Request a small search of opinion granules for that court.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.govinfo.gov/search",
          params={
              "api_key": os.environ["DATA_GOV_API_KEY"],
              "query": "collection:USCOURTS courtCode:ca9",
              "pageSize": 20,
              "offsetMark": "*",
          },
          timeout=30,
      )
      response.raise_for_status()
      opinions = pd.json_normalize(response.json()["results"])
      opinions["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(opinions.head())
  first_project:
    title: List Recent Ninth Circuit Opinions
    goal: Test whether GovInfo search can power a bounded federal-opinion inbox.
    steps:
      - Keep package id, title, and dateIssued from the search page.
      - Sort by date and list records missing a court code.
      - Explain that USCOURTS coverage is incomplete and that search hits are not a citator or docket history.
