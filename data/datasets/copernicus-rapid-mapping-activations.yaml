getting_started:
  overview: >
    The public Rapid Mapping API lists activations and offers detail records and product links.
    Start with one activation; its existence does not establish current warning coverage at a location.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review the public activation API documentation and CEMS reuse terms.
    - Request one activation from the public listing.
    - Keep event and update timestamps separate from present hazard status.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations-info/",
          params={"limit": 1, "offset": 0}, timeout=25,
      )
      response.raise_for_status()
      for activation in response.json()["results"]:
          print(activation["code"], activation["name"], activation["eventTime"])
  first_project:
    title: Inspect a Public Activation
    goal: Display one mapped emergency event with its activation identifier and event time.
    steps:
      - Fetch one public activation record.
      - Show the identifier, event date, and affected country.
      - Explain that an activation is not a current local warning.
