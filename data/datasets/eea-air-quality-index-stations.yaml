  European Environment Agency hourly station AQI details for building a measured air-quality context view.
theme: Environment & Hazards
url: https://dis2datalake.blob.core.windows.net/airquality-derivated/AQI-noRunningMeans/current/AT60118.json
access_type: [api]
api_key_required: false
