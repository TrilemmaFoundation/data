last_verified: 2026-09-28
getting_started:
  overview: >
    The EEA Air Quality Index publishes a station metadata index, hourly map,
    and per-station detail JSON. Start with one reviewed Austrian station and
    two hours; modeled gap fills must not be presented as measurements, and
    one station does not establish destination-wide air quality.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the EEA AQI methodology and legal notice.
    - Fetch one station-detail artifact from the official AQI data lake.
    - Inspect the observation and modeled flags for two hourly records.
  python:
    packages: [requests]
    code: |
      import requests
      from datetime import datetime, timezone

      url = ("https://dis2datalake.blob.core.windows.net/airquality-derivated/"
             "AQI-noRunningMeans/current/AT60118.json")
      response = requests.get(url, timeout=20)
      response.raise_for_status()
      now = datetime.now(timezone.utc)
      observed = []
      for hour, row in response.json().items():
          pollutant = row.get("culprit")
          if (pollutant and datetime.fromisoformat(hour.replace("Z", "+00:00")) <= now
                  and row.get(f"modelled_{pollutant}") == 0):
              observed.append((hour, row))
      for hour, row in sorted(observed)[-2:]:
          print(hour, row.get("aqi"), row.get("culprit"))
  first_project:
    title: Inspect Station AQI Context
    goal: Compare two station hours while retaining modeled-value provenance.
    steps:
      - Fetch one station's dated hourly values.
      - Display the culprit pollutant and model flag beside AQI.
      - Explain why a modeled fill or one station is not a local measurement.
