getting_started:
  overview: >
    Rijkswaterstaat's operational WaterWebservices publish the latest reading for a named station.
    Start with one station and retain its quality code, observation time, and NAP datum;
    a water-level measurement is not a flood warning.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review the current WaterWebservices documentation and CC0 scope.
    - Request one station's latest OW water-height measurement in centimeters relative to NAP.
    - Check the timestamp and quality code before interpreting the value.
  python:
    packages: [requests]
    code: |
      import requests

      url = "https://ddapi20-waterwebservices.rijkswaterstaat.nl/ONLINEWAARNEMINGENSERVICES/OphalenLaatsteWaarnemingen"
      payload = {
          "LocatieLijst": [{"Code": "amsterdam.surinamekade"}],
          "AquoPlusWaarnemingMetadataLijst": [{
              "AquoMetadata": {
                  "Compartiment": {"Code": "OW"}, "Grootheid": {"Code": "WATHTE"},
                  "Eenheid": {"Code": "cm"}, "Hoedanigheid": {"Code": "NAP"},
                  "ProcesType": "meting",
              },
              "WaarnemingMetadata": {"KwaliteitswaardecodeLijst": ["00", "10", "20", "25", "30", "40"]},
          }],
      }
      response = requests.post(url, json=payload, timeout=20)
      response.raise_for_status()
      for station in response.json()["WaarnemingenLijst"][:1]:
          for reading in station["MetingenLijst"][:1]:
              print(station["Locatie"]["Naam"], reading["Tijdstip"],
                    reading["Meetwaarde"]["Waarde_Numeriek"],
                    reading["WaarnemingMetadata"]["Kwaliteitswaardecode"])
  first_project:
    title: Inspect One Water-Level Reading
    goal: Display a dated, quality-labeled observation at a named Dutch station.
    steps:
      - Fetch the latest observation for one mapped station.
      - Show its time, quality code, and centimeter value relative to NAP.
      - Explain that the reading does not establish an official flood warning.
