getting_started:
  overview: >
    DailyMed REST returns Structured Product Labeling metadata and sections.
    Start with one drug name search and a single SET ID. Labels are regulatory
    documents, not a complete picture of off-label use, and they can lag
    manufacturer updates.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the DailyMed web-services help page.
    - Search drug names for one generic and request the first page.
    - Keep SET ID, title, and last-updated date.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://dailymed.nlm.nih.gov/dailymed/services/v2/spls.json",
          params={"drug_name": "ibuprofen", "pagesize": 20, "page": 1},
          timeout=30,
      )
      response.raise_for_status()
      labels = pd.DataFrame(response.json()["data"])
      labels["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(labels.head())
  first_project:
    title: List Ibuprofen SPL Titles
    goal: Test whether DailyMed search can power a bounded label-lookup inbox.
    steps:
      - Keep SET ID, title, and published date from the first page.
      - Deduplicate SET IDs and list titles that look like different dosage forms.
      - Explain that SPL is the currently published label text and is not a complete clinical-use database.
