getting_started:
  overview: >
    The NVD enriches CVE records with CVSS metrics, weaknesses, references, and
    affected-product configurations. Start with records modified during one
    recent week. NVD analysis can lag publication, CPE matching is imperfect,
    and CVSS severity does not measure exposure or business impact.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the NVD API guidance and choose a modification window no longer than seven days.
    - Request a small page and honor rate limits; add a free key later only if higher throughput is necessary.
    - Retain CVE identifiers, publication time, modification time, and analysis status.
  python:
    packages:
      - pandas
      - requests
    code: |
      from datetime import datetime, timedelta, timezone
      import pandas as pd
      import requests

      end = datetime.now(timezone.utc)
      start = end - timedelta(days=7)
      response = requests.get(
          "https://services.nvd.nist.gov/rest/json/cves/2.0",
          params={
              "lastModStartDate": start.isoformat(timespec="milliseconds"),
              "lastModEndDate": end.isoformat(timespec="milliseconds"),
              "resultsPerPage": 100,
              "noRejected": "",
          },
          timeout=30,
      )
      response.raise_for_status()
      records = pd.json_normalize([item["cve"] for item in response.json()["vulnerabilities"]])
      print(records[["id", "published", "lastModified", "vulnStatus"]].head(20))
  first_project:
    title: Monitor Recently Modified Vulnerabilities
    goal: Identify CVE records modified during the last seven days and review their analysis status.
    steps:
      - Retrieve one bounded modification window and exclude rejected records.
      - Summarize records by analysis status and inspect CVSS and affected-product fields when present.
      - Explain why NVD lag, CPE applicability, asset exposure, and business impact must qualify prioritization.
