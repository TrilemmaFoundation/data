id: epa-sdwis-bulk-submission
name: EPA SDWIS Bulk Submission Archive
description: >
  EPA Safe Drinking Water Act public-system and violation bulk tables for reproducible compliance analysis.
theme: Health, Food & Safety
url: https://echo.epa.gov/tools/data-downloads/sdwa-download-summary
access_type: [download]
api_key_required: false
free_to_access: true
size_gb_min: 0.3
size_gb_max: 5.2
formats: [ZIP, CSV]
license: >
  EPA-produced data are public domain unless otherwise specified; cite EPA and
  preserve submission-quarter, system, reporting, and data-quality limitations.
license_url: https://edg.epa.gov/epa_data_license.html
url_checks:
  source_marker: SDWA_PUB_WATER_SYSTEMS.csv
  license_marker: all data produced by the U.S EPA is by default in the public domain
