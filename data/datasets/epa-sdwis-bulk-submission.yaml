provider: U.S. Environmental Protection Agency
source_type: government
last_verified: 2026-09-28
getting_started:
  overview: >
    HouseHunter pins EPA's 2026Q2 SDWIS bulk ZIP, not the ECHO web-service
    response. Start with a bounded byte range from the current official archive
    to verify its ZIP member and submission quarter. The current URL may advance;
    do not use a later quarter as if it were HouseHunter's pinned input.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read EPA's bulk-download dictionary and public-domain notice.
    - Fetch a bounded first range of the official ZIP and inspect its first member.
    - Download and pin the full archive only when you need to join system and violation tables.
  python:
    packages: [requests]
    code: |
      import csv
      import io
      import struct
      import zlib
      import requests

      response = requests.get(
          "https://echo.epa.gov/files/echodownloads/SDWA_latest_downloads.zip",
          headers={"Range": "bytes=0-131071"}, timeout=30,
      )
      response.raise_for_status()
      assert response.status_code == 206, "Server did not honor bounded byte range"
      chunk = response.content
      header = struct.unpack_from("<IHHHHHIIIHH", chunk)
      assert header[0] == 0x04034B50 and header[3] == 8
      start = 30 + header[-2] + header[-1]
      name = chunk[30:30 + header[-2]].decode()
      text = zlib.decompressobj(-15).decompress(chunk[start:]).decode()
      rows = csv.DictReader(io.StringIO("\n".join(text.splitlines()[:3])))
      print(name, [(row["SUBMISSIONYEARQUARTER"], row["PWSID"]) for row in rows])
  first_project:
    title: Check a SDWIS Submission Quarter
    goal: Verify the archive's reported quarter before combining public-system tables.
    steps:
      - Inspect a bounded archive member and its SUBMISSIONYEARQUARTER values.
      - Record the archive URL, retrieval time, and hash before full download.
      - Explain why system records and violation records need quarter-aware joins.
