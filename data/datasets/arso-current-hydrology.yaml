getting_started:
  overview: The official Slovenian Environment Agency feed supplies current public data. Start with two
    current Slovenian stations; a provisional station level is not a flood warning or a destination-wide
    measurement.
  prerequisites:
  - Python 3.10 or newer
  - An internet connection
  - The requests Python package
  access_steps:
  - Read the official data documentation and reuse terms.
  - Fetch the small official feed and inspect two records.
  - Preserve source timestamps and locations before mapping results.
  python:
    packages:
    - requests
    code: |
      import requests
      from xml.etree import ElementTree as ET

      url = "https://www.arso.gov.si/xml/vode/hidro_podatki_zadnji.xml"
      response = requests.get(url, timeout=20)
      response.raise_for_status()
      root = ET.fromstring(response.content)
      print("Prepared", root.findtext("datum_priprave"))
      for station in root.findall("postaja")[:2]:
          print(station.get("sifra"), station.findtext("reka"),
                station.findtext("vodostaj"), station.findtext("datum_cet"))
  first_project:
    title: Inspect Dated Local Conditions
    goal: Inspect two current Slovenian stations with source timestamps.
    steps:
    - Fetch the official source and retain its update time.
    - Show two records with their station or notice identifiers.
    - Explain why these records are context rather than complete hazard coverage.
