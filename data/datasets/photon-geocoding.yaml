  Komoot permits reasonable free use of its public demo without uptime guarantees;
  OpenStreetMap-derived data requires ODbL attribution and share-alike compliance.
license_url: https://github.com/komoot/photon/blob/master/README.md
url_checks:
  source_marker: '"name":"Zurich","'
  license_marker: number of requests stay in a reasonable
domains: [Geography]
data_types: [Geospatial]
tasks: [Search, Mapping]
