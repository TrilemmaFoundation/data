description: >
  OpenStreetMap-based Photon place-search results for adding small-scale geocoding to a map application.
theme: Geospatial & Infrastructure
url: https://photon.komoot.io/api/?q=Zurich&limit=2
access_type: [api]
api_key_required: false
free_to_access: true
