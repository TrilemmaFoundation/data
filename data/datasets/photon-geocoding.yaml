geography: [Global]
temporal_coverage: current Photon search index
update_frequency: occasional
provider: Komoot Photon
source_type: company
last_verified: 2026-09-28
getting_started:
  overview: >
    Komoot's public Photon demo answers small place searches without a key.
    Start with one query and two results; the demo may throttle heavy use and
    has no availability guarantee, while OpenStreetMap attribution still applies.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read the Photon public demo policy and OpenStreetMap data terms.
    - Search for one place with a two-result limit.
    - Inspect each candidate's name and coordinates before using it.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://photon.komoot.io/api/",
          params={"q": "Zurich", "limit": 2},
          headers={"User-Agent": "TrilemmaDataCatalog/1.0"}, timeout=20,
      )
      response.raise_for_status()
      for place in response.json()["features"]:
          print(place["properties"].get("name"), place["geometry"]["coordinates"])
  first_project:
    title: Search for Map Destinations
    goal: Show two geocoding candidates with their source coordinates.
    steps:
      - Query one place name with a bounded result count.
      - Display candidate labels and coordinates for user selection.
      - Explain that similarly named places require location confirmation.
