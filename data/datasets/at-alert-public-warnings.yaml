getting_started:
  overview: >
    AT-Alert lists current public warnings through a JSON RPC POST endpoint.
    Start with at most five production alert records; an empty response is
    possible. Preserve official polygons, severity, and begin/end times, and
    exclude tests before presenting any warning.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official AT-Alert site and public-data reuse terms.
    - POST a five-record request for production alert levels.
    - Check alert identifier, validity, level, and geography.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.post(
          "https://warnung.at-alert.at/api/rpc/alert/list",
          json={"json": {"limit": 5, "offset": 0,
                         "alertLevels": ["AlertLevel1", "AlertLevel2",
                                         "AlertLevel3", "AlertLevel4"]}},
          timeout=30,
      )
      response.raise_for_status()
      payload = response.json()["json"]
      print(f"{payload['totalCount']} production alerts in this response")
      for alert in payload["alerts"][:5]:
          print(alert.get("consolidation_identifier"), alert.get("alert_level"),
                alert.get("begin_date"), alert.get("end_date"))
  first_project:
    title: Inspect Austrian Civil Alerts
    goal: Check a bounded AT-Alert response for region-specific warning review.
    steps:
      - Keep issuer, alert ID, severity, validity, and official polygons.
      - Reject test messages and handle updates and expirations.
      - Explain why no returned records do not establish an all-clear.
