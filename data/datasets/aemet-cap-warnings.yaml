getting_started:
  overview: >
    AEMET publishes adverse-weather warnings through an Atom index with CAP
    details. Start with five current Atom entries, preserving IDs and update
    times. The legal notice requires source attribution and forbids distorting
    technical meaning; verify official area and validity before display.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read AEMET's CAP feed page and legal reuse conditions.
    - Fetch the national Atom index and inspect at most five entries.
    - Use linked CAP details for severity, affected area, and expiry.
  python:
    packages:
      - requests
    code: |
      import xml.etree.ElementTree as ET
      import requests

      response = requests.get(
          "https://www.aemet.es/documentos_d/eltiempo/prediccion/avisos/rss/"
          "CAP_AFAE_ATOM.xml", timeout=30,
      )
      response.raise_for_status()
      root = ET.fromstring(response.content)
      atom = "{http://www.w3.org/2005/Atom}"
      print(root.findtext(f"{atom}updated"))
      for entry in root.findall(f"{atom}entry")[:5]:
          print(entry.findtext(f"{atom}id"), entry.findtext(f"{atom}title"))
  first_project:
    title: Inspect Spanish CAP Publications
    goal: Test the official warning index for a bounded Spanish alert card.
    steps:
      - Keep AEMET IDs, update timestamps, and CAP detail links.
      - Check whether each CAP message is current and applies to the intended area.
      - Explain why Atom publication alone cannot establish local warning coverage.
