getting_started:
  overview: >
    MEDSL publishes county presidential returns on Harvard Dataverse. Start
    with one election year and two-party totals. County shapefiles, third-party
    votes, and certified state files can disagree, and this is not precinct
    data.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the MEDSL data page and follow the county presidential returns Dataverse record.
    - Download the CSV for the latest presidential cycle.
    - Keep year, county FIPS, Democratic votes, and Republican votes.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      returns = pd.read_csv(
          "https://dataverse.harvard.edu/api/access/datafile/6188156",
          encoding="latin-1",
      )
      print(returns.head())
  first_project:
    title: Map one year's county presidential margins
    goal: Test whether county returns can power a bounded result-map prototype.
    steps:
      - Filter to one year and keep county FIPS plus Democratic and Republican votes.
      - Compute two-party vote share and list counties with missing FIPS.
      - Explain that county totals can differ from certified state files and are not precinct results.
