getting_started:
  overview: >
    Comtrade preview returns up to 500 trade records without a key. Start with
    one reporter, one year, and total merchandise trade. Mirror statistics
    disagree, confidential HS lines are suppressed, and a preview is not a
    complete bulk extract.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open Comtrade Plus and note the preview API for unauthenticated queries.
    - Request one reporter, one period, and HS total trade with a small record limit.
    - Keep reporter, partner, flow, and primary value.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://comtradeplus.un.org/api/preview/C/A/HS",
          params={
              "reporterCode": 842,
              "period": 2023,
              "partnerCode": 0,
              "cmdCode": "TOTAL",
              "flowCode": "X,M",
              "maxRecords": 100,
          },
          timeout=60,
      )
      response.raise_for_status()
      payload = response.json()
      trade = pd.DataFrame(payload.get("data", payload))
      trade["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(trade.head())
  first_project:
    title: Compare U.S. Total Merchandise Exports and Imports
    goal: Test whether a preview extract can power a bounded trade-balance sketch.
    steps:
      - Keep reporter, period, flow, and primary value from the preview response.
      - Compare export and import totals for the selected year.
      - Explain that preview rows are capped, partners can be aggregated, and confidential commodities are omitted.
