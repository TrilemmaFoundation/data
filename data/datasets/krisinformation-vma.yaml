getting_started:
  overview: >
    Krisinformation.se exposes current VMA public announcements through its
    version 3 API. Start with one request and read up to five current records;
    an empty response says only
    that this scoped endpoint returned none. Attribute any displayed message
    and check location and validity before treating it as a local warning.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official open-data description and attribution rule.
    - Request the version 3 VMA endpoint once.
    - Inspect region, issue time, and status of any returned announcement.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://api.krisinformation.se/v3/vmas",
          params={"allCounties": "true", "language": "en"}, timeout=30,
      )
      response.raise_for_status()
      alerts = response.json()
      print(f"{len(alerts)} VMA records returned")
      for alert in alerts[:5]:
          print(alert.get("Identifier"), alert.get("Updated"), alert.get("Counties"))
  first_project:
    title: Inspect Current Swedish VMA Alerts
    goal: Check a scoped official response before local alert matching.
    steps:
      - Preserve announcement identifiers, region, issue time, and updates.
      - Link to Krisinformation.se and credit the source.
      - Do not infer nationwide safety from an empty response.
