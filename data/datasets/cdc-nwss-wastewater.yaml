getting_started:
  overview: >
    NWSS publishes site-level wastewater viral detections on data.cdc.gov.
    Start with a few recent influenza A rows. Coverage is incomplete — not
    every utility reports — and detections are not clinical incidence.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the wastewater about-data page and note sewershed coverage gaps.
    - Request a bounded JSON extract from the Influenza A wastewater dataset.
    - Keep site, county, sample date, and detection fields with the retrieval timestamp.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://data.cdc.gov/resource/ymmh-divb.json",
          params={"$limit": 20, "$order": "sample_collect_date DESC"},
          timeout=30,
      )
      response.raise_for_status()
      wastewater = pd.DataFrame(response.json())
      wastewater["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(
          wastewater[
              [
                  "site",
                  "state_territory",
                  "counties_served",
                  "sample_collect_date",
                  "pcr_target",
                  "pcr_target_detect",
              ]
          ].head(20)
      )
  first_project:
    title: Flag recent influenza A wastewater detections
    goal: Test whether recent site-level influenza A detections can power a bounded community alert.
    steps:
      - Inspect site, county, sample date, and pcr_target_detect for the latest rows.
      - Count detections by state and note sites with missing counties or population served.
      - Explain that wastewater detections are not case counts and that unsewered communities are missing.
