getting_started:
  overview: >
    eHYD's pegel_aktuell collection publishes current station values and stage codes.
    Start with one water-level feature; a raw level without its station-specific threshold is not a warning.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review the eHYD OGC collection and its linked CC BY 4.0 licence.
    - Request one water-level feature using the parameter filter.
    - Keep its station, unit, timestamp, and code together.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://gis.lfrz.gv.at/api/geodata/i000501/ogc/features/v1/collections/i000501:pegel_aktuell/items",
          params={"f": "application/geo+json", "limit": 1,
                  "filter-lang": "cql2-text", "filter": "parameter = 'W'"},
          timeout=20,
      )
      response.raise_for_status()
      for feature in response.json()["features"]:
          station = feature["properties"]
          print(station["messstelle"], station["wert"], station["einheit"],
                station["zeitpunkt"], station["gesamtcode"])
  first_project:
    title: Inspect One Austrian Gauge
    goal: Display one dated water-level observation with its stage code.
    steps:
      - Fetch one W-parameter gauge feature.
      - Show its value, unit, observation time, and stage code.
      - Explain that local thresholds are needed to interpret the stage.
