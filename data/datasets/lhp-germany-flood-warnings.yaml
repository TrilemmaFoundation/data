getting_started:
  overview: >
    The LHP public API returns current regional flood alerts as GeoJSON with
    update metadata and a CC BY licence link. Start with one response and
    inspect at most five features. An empty regional result must not be
    interpreted as a comprehensive flood all-clear.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read LHP's official portal and the licence advertised by its API.
    - Fetch a single current GeoJSON response.
    - Keep update time and geographic scope when showing an alert.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://api.hochwasserzentralen.de/public/v1/data/alerts",
          params={"format": "geojson", "lang": "en"}, timeout=30,
      )
      response.raise_for_status()
      data = response.json()
      print(data["updated"], len(data["features"]))
      for feature in data["features"][:5]:
          print(feature.get("properties", {}))
  first_project:
    title: Inspect Regional Flood Alerts
    goal: Test the official alert snapshot for a small German flood map.
    steps:
      - Keep the snapshot update time, alert identifier, and geometry.
      - Compare empty and populated states without inferring safety from either.
      - Explain why official warnings differ from raw gauge levels and require attribution.
