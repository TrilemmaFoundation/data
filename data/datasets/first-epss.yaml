getting_started:
  overview: >
    EPSS estimates the probability that a published CVE will be exploited in
    the next 30 days. Start with one CVE and the current daily score. EPSS is
    a likelihood model, not proof of exploitation, and it does not replace
    asset exposure or CISA Known Exploited Vulnerabilities evidence.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the EPSS FAQ, including the request to attribute FIRST when scores appear in a product.
    - Request the current score for one CVE from the public API.
    - Keep the CVE identifier, EPSS score, percentile, and retrieval time.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.first.org/data/v1/epss",
          params={"cve": "CVE-2024-3400"},
          timeout=30,
      )
      response.raise_for_status()
      scores = pd.DataFrame(response.json()["data"])
      scores["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(scores[["cve", "epss", "percentile", "date"]].head())
  first_project:
    title: Compare One CVE's Exploit Probability with Its KEV Status
    goal: Test whether EPSS can rank a published CVE before treating it as an active incident.
    steps:
      - Retrieve the current EPSS score and percentile for CVE-2024-3400.
      - Record whether the same CVE appears on an authorized Known Exploited Vulnerabilities list.
      - Explain why a high EPSS score is not the same as confirmed exploitation or organizational exposure.
