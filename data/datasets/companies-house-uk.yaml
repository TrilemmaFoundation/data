getting_started:
  overview: >
    The Companies House API returns public register records for UK companies.
    Start with one company number after creating a free API key. Register data
    can lag filings, dissolved companies remain searchable, and you remain
    responsible for data-protection rules when publishing officer details.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - A free Companies House API key saved in the COMPANIES_HOUSE_API_KEY environment variable
  access_steps:
    - Register a Companies House developer account and create an API key.
    - Read the data-products page, including the notice that the public register has no reuse licence restrictions.
    - Request one company profile by company number.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.company-information.service.gov.uk/company/00000006",
          auth=(os.environ["COMPANIES_HOUSE_API_KEY"], ""),
          timeout=30,
      )
      response.raise_for_status()
      profile = pd.json_normalize(response.json())
      print(profile.filter(regex="company_name|company_number|company_status|sic").head())
  first_project:
    title: Look up one UK company's status and SIC codes
    goal: Test whether the public register can power a company-status card.
    steps:
      - Keep company number, name, status, and SIC codes.
      - Record the accounts and confirmation-statement due dates if present.
      - Explain that officer and address fields are personal data and that register lag can make a "live" status stale.
