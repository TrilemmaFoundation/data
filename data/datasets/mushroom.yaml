getting_started:
  overview: >
    Mushroom is an all-categorical binary classification problem with a missing
    value marker. It is educational only and must never guide mushroom consumption.
  prerequisites:
    - Python 3.10 or newer
    - Familiarity with categorical encoding
  access_steps:
    - Open the official UCI page and read the safety warning and variable meanings.
    - Install ucimlrepo, then run the example to fetch dataset ID 73.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      mushrooms = fetch_ucirepo(id=73)
      data = mushrooms.data.original
      print(data.head())
      print(mushrooms.data.targets.value_counts())
  first_project:
    title: Explore categorical signals
    goal: Find which recorded characteristics are most associated with the class label.
    steps:
      - Count category values and identify the missing-value marker.
      - Compare class proportions across odor and spore-print-color categories.
      - Train a simple classifier and clearly state that it is not a safety tool.
