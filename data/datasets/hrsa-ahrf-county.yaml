getting_started:
  overview: >
    HRSA publishes a county CSV archive and records no usage limitation. Start with one
    county row and a named clinician variable from the 2024-2025 release. The release
    year is not every variable's measurement year, and supply does not prove access to care.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read HRSA's annual release details, data dictionary, and usage terms.
    - Download the 2024-2025 county CSV archive from HRSA.
    - Inspect the county identifier and one clinician-supply field.
  python:
    packages: [requests]
    code: |
      import csv
      import io
      import zipfile
      import requests

      url = "https://data.hrsa.gov/DataDownload/AHRF/AHRF_2024-2025_CSV.zip"
      response = requests.get(url, timeout=60)
      response.raise_for_status()
      with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
          name = next(n for n in archive.namelist() if n.endswith("AHRF2025.csv"))
          with archive.open(name) as file:
              row = next(csv.DictReader(io.TextIOWrapper(file, encoding="utf-8-sig")))
      print(row["fips_st_cnty"], row["phys_nf_prim_care_pc_exc_rsdt_23"])
  first_project:
    title: Compare County Clinician Supply
    goal: Compare one documented provider-supply variable across counties using a fixed AHRF release.
    steps:
      - Select the county FIPS and provider field from the release dictionary.
      - Compare the same variable and measurement year across two counties.
      - Explain why clinician counts do not establish appointment availability.
