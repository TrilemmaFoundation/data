getting_started:
  overview: >
    Met Éireann exposes current warnings as JSON with CAP IDs, regions, and
    issue/onset/expiry times. Start with five records. Its reuse terms require
    attribution and preserving warning meaning; remove expired warnings and
    do not treat an empty list as a general safety statement.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read Met Éireann's open-data and weather-warning reuse conditions.
    - Fetch the national JSON warning list once.
    - Retain region IDs and full validity intervals when displaying warnings.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://www.met.ie/Open_Data/json/warning_IRELAND.json", timeout=30,
      )
      response.raise_for_status()
      for warning in response.json()[:5]:
          print(warning["capId"], warning["level"], warning["regions"],
                warning["onset"], warning["expiry"])
  first_project:
    title: Inspect Current Irish Weather Warnings
    goal: Evaluate a county-matched alert card using official warning records.
    steps:
      - Keep CAP IDs, county regions, severity, and issue/onset/expiry times.
      - Remove expired and superseded warnings before display.
      - Explain why these region warnings do not imply an all-clear elsewhere.
