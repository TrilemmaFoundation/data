getting_started:
  overview: >
    CPSC's Recall Retrieval service returns consumer product recalls as JSON.
    Start with a short date window; an unfiltered request can return the entire
    catalog. A recall record is not a current inventory check, and date
    parameters must be spelled exactly.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the CPSC recalls page and note that the retrieval service lives on saferproducts.gov.
    - Query JSON for a bounded recall-date window.
    - Keep recall numbers, titles, and dates before summarizing hazards.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.saferproducts.gov/RestWebServices/Recall",
          params={
              "format": "json",
              "RecallDateStart": "2025-01-01",
              "RecallDateEnd": "2025-03-31",
          },
          timeout=30,
      )
      response.raise_for_status()
      recalls = pd.DataFrame(response.json())
      recalls["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(recalls[["RecallNumber", "Title", "RecallDate"]].head(20))
  first_project:
    title: Summarize first-quarter consumer product recalls
    goal: Identify which product titles appear most often in a bounded CPSC recall window.
    steps:
      - Confirm the request used RecallDateStart and RecallDateEnd rather than an unfiltered dump.
      - Count recalls by month and inspect a sample of titles and hazards.
      - State that CPSC recalls are not vehicle or food-enforcement records and that remedy status can change after publication.
