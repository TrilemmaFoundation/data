  Country Atom feeds of European weather warnings from MeteoAlarm for
  checking official alert publications and their validity windows.
theme: Environment & Hazards
url: https://feeds.meteoalarm.org/
access_type:
  - api
api_key_required: false
free_to_access: true
size_gb_min: 0
size_gb_max: 0.01
formats:
  - Atom
license: CC BY 4.0-equivalent warning feed with additional redistribution conditions; analytical use requires attribution.
license_url: https://www.meteoalarm.org/en/live/terms-and-conditions/
url_checks:
  source_marker: Legacy RSS Feeds Have Been Sunset
  license_marker: Terms and Conditions
