source_type: intergovernmental
last_verified: 2026-09-28
getting_started:
  overview: >
    MeteoAlarm maintains country Atom feeds; its old RSS feeds stopped updating
    in 2026. Start with one small country feed and inspect entry titles and
    update timestamps. Read the additional redistribution conditions before
    republishing warning content. An empty feed is not an all-clear elsewhere.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the MeteoAlarm feed list and terms, including redistribution requirements.
    - Fetch one country Atom feed rather than the Europe-wide feed.
    - Inspect each entry's issue and update metadata before mapping it to a place.
  python:
    packages:
      - requests
    code: |
      import xml.etree.ElementTree as ET
      import requests

      response = requests.get(
          "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-andorra",
          timeout=30,
      )
      response.raise_for_status()
      root = ET.fromstring(response.content)
      namespace = {"atom": "http://www.w3.org/2005/Atom"}
      entries = root.findall("atom:entry", namespace)
      print(f"{len(entries)} current Andorra feed entries")
      for entry in entries[:5]:
          print(entry.findtext("atom:title", default="", namespaces=namespace),
                entry.findtext("atom:updated", default="", namespaces=namespace))
  first_project:
    title: Inspect One Country Warning Feed
    goal: Check Atom publication metadata for a bounded warning display.
    steps:
      - Keep feed country, entry identifiers, update times, and official links.
      - Verify warning geometry and validity before showing local coverage.
      - Explain why warning content needs MeteoAlarm attribution and an extra redistribution review.
