getting_started:
  overview: >
    OurAirports publishes a nightly airports.csv covering worldwide aerodromes.
    Start with large airports in one country. Community coordinates and names
    can be incomplete, and the file is not an official aeronautical chart.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the data page and note the public-domain terms.
    - Download airports.csv from the published GitHub Pages mirror.
    - Filter to one ISO country and large airports before mapping.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      airports = pd.read_csv(
          "https://davidmegginson.github.io/ourairports-data/airports.csv"
      )
      us_large = airports[
          (airports["iso_country"] == "US")
          & (airports["type"] == "large_airport")
      ]
      print(
          us_large[
              ["ident", "name", "municipality", "latitude_deg", "longitude_deg"]
          ].head()
      )
  first_project:
    title: Map large U.S. airports from the public-domain dump
    goal: Test whether OurAirports can power a bounded aviation directory layer.
    steps:
      - Keep ident, name, municipality, and coordinates for U.S. large airports.
      - Count missing municipalities before plotting.
      - Explain that community airport records are not a substitute for official NASR or AIP charts.
