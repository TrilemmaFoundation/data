getting_started:
  overview: >
    Start with one year and a small API page of infractions. Locations are
    aggregated to 100-block units, Vancouver Police Department tickets are
    excluded, and records do not show later status changes.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official dataset page and review the location and coverage notes.
    - Query a bounded page through the OpenDataSoft API.
    - Keep infraction date, block, street, bylaw, section, status, and description.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      url = "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/parking-tickets/records"
      response = requests.get(
          url,
          params={"limit": 100, "order_by": "entrydate DESC"},
          timeout=30,
      )
      response.raise_for_status()
      tickets = pd.json_normalize(response.json()["results"])
      columns = [
          "entrydate",
          "block",
          "street",
          "bylaw",
          "section",
          "status",
          "infractiontext",
      ]
      print(tickets[columns].head())
  first_project:
    title: Find Parking Enforcement Hotspots
    goal: Test whether ticket counts can support a coarse block-level enforcement map.
    steps:
      - Group sampled tickets by street, 100-block, and infraction description.
      - Compare counts across dates and ticket statuses.
      - Explain why block aggregation, agency exclusions, and issue-date status limit parking-demand conclusions.
