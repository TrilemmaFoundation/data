getting_started:
  overview: >
    The Environment Agency's flood API lists current official alerts and
    warnings, refreshed about every fifteen minutes. Start with five records
    from one response and preserve severity and flood-area identifiers.
    Warning geography is not equivalent to a nearby gauge measurement.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official API reference and Open Government Licence attribution.
    - Fetch the current flood-warning list once.
    - Inspect severity and flood-area IDs before mapping warnings.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://environment.data.gov.uk/flood-monitoring/id/floods",
          timeout=30,
      )
      response.raise_for_status()
      for warning in response.json()["items"][:5]:
          print(warning["floodAreaID"], warning["severity"],
                warning.get("timeMessageChanged"))
  first_project:
    title: Inspect Current Flood Severities
    goal: Check whether current warnings support a region-specific alert card.
    steps:
      - Keep flood-area identifiers, warning IDs, severity, and change times.
      - Distinguish current warnings from withdrawn warnings and river readings.
      - Explain why an empty feed does not establish safety outside a reviewed flood area.
