getting_started:
  overview: >
    FEMA publishes separate tract and county National Risk Index layers. Start
    with five tract records from the official ArcGIS service and keep the NRI
    version. The composite building-loss rate is modeled, not a prediction for an individual home.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Open FEMA's National Risk Index data resources and distinguish its tract and county layers.
    - Query a bounded sample of the tract FeatureServer layer without geometry.
    - Keep tract identifiers and the model version when comparing risk fields.
  python:
    packages:
      - requests
    code: |
      import requests

      url = (
          "https://services.arcgis.com/XG15cJAlne2vxtgt/arcgis/rest/services/"
          "National_Risk_Index_Census_Tracts/FeatureServer/0/query"
      )
      response = requests.get(
          url,
          params={
              "where": "1=1",
              "outFields": "TRACTFIPS,ALR_VALB,NRI_VER",
              "returnGeometry": "false",
              "resultRecordCount": 5,
              "f": "json",
          },
          timeout=30,
      )
      response.raise_for_status()
      result = response.json()
      if "error" in result:
          raise RuntimeError(result["error"])
      for feature in result["features"]:
          print(feature["attributes"])
  first_project:
    title: Compare Tract Hazard Context
    goal: Test whether a bounded tract sample supports a location-screening prototype.
    steps:
      - Read the tract identifier, model version, and composite building-loss rate field.
      - Compare only tracts from the same NRI version and keep missing values distinct from zero.
      - Explain why a modeled tract loss rate cannot estimate the risk or insurance cost of a particular home.
