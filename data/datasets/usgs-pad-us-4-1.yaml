getting_started:
  overview: >
    The official PAD-US 4.1 combined MapServer publishes ownership and public-access attributes.
    Start with one feature; a protected designation alone does not mean public access.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Review the USGS PAD-US 4.1 release and public-access field definitions.
    - Query one feature from the combined MapServer layer.
    - Keep the access code separate from the protected-area category.
  python:
    packages: [requests]
    code: |
      import requests

      response = requests.get(
          "https://edits.nationalmap.gov/arcgis/rest/services/PAD-US/PAD_US_gaz_combined/MapServer/0/query",
          params={"where": "1=1", "outFields": "OBJECTID,Unit_Nm,Pub_Access",
                  "returnGeometry": "false", "resultRecordCount": 1, "f": "json"},
          timeout=25,
      )
      response.raise_for_status()
      for feature in response.json()["features"]:
          print(feature["attributes"])
  first_project:
    title: Inspect Protected-Area Access
    goal: Show one PAD-US unit and its published public-access code.
    steps:
      - Fetch one PAD-US 4.1 feature.
      - Display its unit name and access code.
      - Explain why unknown access cannot be counted as freely accessible land.
