getting_started:
  overview: >
    Seeds is balanced, tiny, numeric, and free of missing values. It works well
    for a first comparison of supervised classification and unsupervised clustering.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
  access_steps:
    - Open the official UCI page and review the seven geometric measurements.
    - Download seeds_dataset.txt and save it beside your notebook.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      columns = [
          "area", "perimeter", "compactness", "length",
          "width", "asymmetry", "groove_length", "variety",
      ]
      data = pd.read_csv("seeds_dataset.txt", sep=r"\s+", names=columns)
      print(data.head())
      print(data["variety"].value_counts().sort_index())
  first_project:
    title: Compare three wheat varieties
    goal: Find which measurements best distinguish the varieties.
    steps:
      - Compare feature distributions and averages for each variety.
      - Plot two promising measurements and color points by variety.
      - Train a simple classifier and inspect any misclassified kernels.
