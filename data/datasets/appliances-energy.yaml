id: appliances-energy
name: Appliances Energy Prediction
description: >
  Ten-minute appliance energy use, indoor sensor readings, and nearby weather
  observations collected from a low-energy home.

url: https://archive.ics.uci.edu/dataset/374/appliances+energy+prediction
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0.01
size_gb_max: 0.1
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Energy
  - Smart Homes
data_types:
  - Time Series
  - Sensor
tasks:
  - Regression
  - Forecasting
difficulty: intermediate
geography:
  - Belgium
temporal_coverage: "2016"
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    This dataset combines household sensors, weather, and energy at regular
    intervals. It is useful for learning resampling, lag features, and time-aware splits.
  prerequisites:
    - Python 3.10 or newer
    - Basic familiarity with dates and regression
  access_steps:
    - Open the official UCI page and review the ten-minute sampling process.
    - Install ucimlrepo, then run the example to fetch dataset ID 374.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      energy = fetch_ucirepo(id=374)
      data = energy.data.original
      print(data.head())
      print(data.describe())
  first_project:
    title: Explain household energy peaks
    goal: Find when appliance demand is highest and which conditions accompany it.
    steps:
      - Parse the timestamp and chart appliance energy over one week.
      - Aggregate usage by hour of day and day of week.
      - Train on earlier observations, test on later ones, and report mean absolute error.
