getting_started:
  overview: >
    The UIS Data API returns internationally comparable education indicators.
    Start with completion rate CR.1 for one country and a few recent years.
    Values can lag, national definitions differ, and ShareAlike applies to
    adapted data products.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the UIS Data Browser resources page and confirm the indicator definition for CR.1.
    - Request one indicator for one country and a bounded year window.
    - Keep indicatorId, geoUnit, year, and value with any qualifier fields.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.uis.unesco.org/api/public/data/indicators",
          params={
              "indicator": "CR.1",
              "geoUnit": "USA",
              "start": 2020,
              "end": 2022,
          },
          timeout=30,
      )
      response.raise_for_status()
      observations = pd.DataFrame(response.json()["records"])
      observations["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(observations[["indicatorId", "geoUnit", "year", "value"]].head())
  first_project:
    title: Compare Primary Completion for Two Countries
    goal: Test whether one UIS completion-rate series can power a bounded country comparison.
    steps:
      - Repeat the request for a second country and concatenate the year-value rows.
      - Plot both series and report missing years before interpreting a gap.
      - Attribute UIS under CC BY-SA 3.0 IGO and state that national definitions can differ.
