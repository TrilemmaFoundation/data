getting_started:
  overview: >
    The Senate LDA API lists lobbying filings, registrants, and clients. Start
    with a small page of recent filings. Reported income is self-disclosed,
    issue codes are broad, and a filing is not a complete map of influence.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the LDA API documentation and choose the filings list endpoint.
    - Request one page of recent filings.
    - Keep filing UUID, registrant, client, and filing type.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://lda.gov/api/v1/filings/",
          params={"page_size": 25, "ordering": "-dt_posted"},
          timeout=30,
          headers={"Accept": "application/json"},
      )
      response.raise_for_status()
      filings = pd.json_normalize(response.json()["results"])
      filings["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(filings.head())
  first_project:
    title: Scan Recent LDA Filings
    goal: Test whether the filings list can power a bounded lobbying-disclosure inbox.
    steps:
      - Keep filing identifier, registrant name, client name, and posted date.
      - Count filings by registrant on the first page and list missing client names.
      - Explain that LDA reports are self-disclosed summaries and are not a complete record of lobbying contacts.
