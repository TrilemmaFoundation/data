getting_started:
  overview: >
    The GOV.UK Content API returns structured advice for one country path.
    Start with Switzerland and inspect its update date; advice is not a
    guarantee of safety or a substitute for the full official notice.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read GOV.UK's Content API documentation and reuse terms.
    - Fetch one country's published advice by its GOV.UK path.
    - Inspect the publication date and link to the complete advice.
  python:
    packages: [requests]
    code: |
      import requests

      url = "https://www.gov.uk/api/content/foreign-travel-advice/switzerland"
      response = requests.get(url, timeout=20)
      response.raise_for_status()
      advice = response.json()
      print(advice["title"], advice.get("public_updated_at"))
      print("https://www.gov.uk" + advice["base_path"])
  first_project:
    title: Build a Dated Country Briefing
    goal: Show a country advice link and its latest publication timestamp.
    steps:
      - Fetch one country record and keep its source path.
      - Display its update date beside a link to the full advice.
      - Explain that official advice can change after the cached snapshot.
