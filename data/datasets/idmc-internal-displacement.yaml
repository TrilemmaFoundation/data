getting_started:
  overview: >
    IDMC's Global Internal Displacement Database publishes country-year stocks
    and new displacements from conflict and disasters. Start with the Excel
    download. Figures are expert-validated estimates, not household surveys,
    and they are not UNHCR refugee counts.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the IDMC displacement-data page and download the GIDD Excel file.
    - Load the conflict-and-disasters sheet.
    - Keep ISO3, year, conflict displacements, and disaster displacements.
  python:
    packages:
      - pandas
      - requests
      - openpyxl
    code: |
      import pandas as pd
      import requests
      from io import BytesIO

      response = requests.get(
          "https://www.internal-displacement.org/sites/default/files/2024-05/IDMC_Internal_Displacement_Conflict-Violence_Disasters.xlsx",
          timeout=60,
      )
      response.raise_for_status()
      displacement = pd.read_excel(BytesIO(response.content), sheet_name=0)
      print(displacement.head())
  first_project:
    title: Compare conflict and disaster displacements
    goal: Test whether GIDD country-year rows can power a bounded humanitarian sketch.
    steps:
      - Keep country, year, and conflict versus disaster displacement columns.
      - Rank one year by new displacements and list missing ISO3 codes.
      - Explain that GIDD figures are curated estimates, not UNHCR refugee statistics, and can be revised.
