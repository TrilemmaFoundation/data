getting_started:
  overview: >
    The Census Geocoder returns address matches and Census tract geography
    for one submitted U.S. address. Start with the Census Bureau's own public
    example address and request the current 2020 geography vintage. Do not
    send confidential addresses in a tutorial; an approximate range match
    needs review before it is used as a property location.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official geocoding request format and API terms.
    - Request one public example address with an explicit benchmark and vintage.
    - Inspect the returned tract identifier and match quality.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress",
          params={"address": "4600 Silver Hill Rd, Washington, DC 20233",
                  "benchmark": "Public_AR_Current", "vintage": "Census2020_Current",
                  "format": "json"}, timeout=30,
      )
      response.raise_for_status()
      for match in response.json()["result"]["addressMatches"][:5]:
          tracts = match["geographies"].get("Census Tracts", [])
          print(match["matchedAddress"], [tract["GEOID"] for tract in tracts])
  first_project:
    title: Check a Census Tract Match
    goal: Inspect a public example address before using geocoding in a local lookup.
    steps:
      - Keep the matched address, coordinates, benchmark, vintage, and tract GEOID.
      - Handle zero or multiple matches without silently choosing one.
      - Explain why address-range coordinates can differ from a parcel location.
