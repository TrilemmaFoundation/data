id: student-performance
name: Student Performance
description: >
  Grades and demographic, social, and school-related attributes from students
  at two Portuguese secondary schools.

url: https://archive.ics.uci.edu/dataset/320/student+performance
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0
size_gb_max: 0.001
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Education
  - Social Science
data_types:
  - Tabular
tasks:
  - Regression
  - Fairness Analysis
difficulty: intermediate
geography:
  - Portugal
temporal_coverage: 2005-2006
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Student Performance offers a compact mixed-type table and a clear prediction
    target, while encouraging care around privacy, fairness, and target leakage.
  prerequisites:
    - Python 3.10 or newer
    - Familiarity with categorical variables and responsible data use
  access_steps:
    - Open the official UCI page and read the collection and target-leakage notes.
    - Install ucimlrepo, then run the example to fetch dataset ID 320.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      students = fetch_ucirepo(id=320)
      data = students.data.original
      print(data.head())
      print(students.data.targets.describe())
  first_project:
    title: Explore final-grade predictors
    goal: Compare a realistic early-warning model with a leakage-prone model.
    steps:
      - Identify fields that would and would not be known early in the school year.
      - Fit one model without prior-period grades and another with them.
      - Compare errors and document fairness, privacy, and intervention limitations.
