getting_started:
  overview: >
    HMDA LAR records loan applications, originations, and denials. Start with
    one year and one state through the Data Browser. Applicant race and
    ethnicity fields have disclosure rules, and a LAR row is not a credit
    decision you can reverse-engineer.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the HMDA Data Publication page and choose the Data Browser.
    - Filter to one year and one state with a small set of fields.
    - Keep action taken, loan amount, and census tract.
  python:
    packages:
      - pandas
      - requests
    code: |
      from io import StringIO
      import pandas as pd
      import requests

      response = requests.get(
          "https://ffiec.cfpb.gov/v2/data-browser-api/view/csv",
          params={
              "years": "2023",
              "states": "VT",
              "actions_taken": "1",
          },
          timeout=120,
      )
      response.raise_for_status()
      loans = pd.read_csv(StringIO(response.text), nrows=200)
      print(loans.head())
  first_project:
    title: Profile Vermont originations
    goal: Test whether a one-state LAR extract can power a bounded mortgage-volume sketch.
    steps:
      - Keep action taken, loan amount, and census tract from the first rows.
      - Summarize origination counts and median loan amount.
      - Explain that HMDA is an application register with suppressed fields and is not a credit-scoring file.
