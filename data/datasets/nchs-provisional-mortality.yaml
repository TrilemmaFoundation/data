getting_started:
  overview: >
    NCHS publishes weekly provisional death counts on data.cdc.gov. Start with
    one jurisdiction and all-cause deaths. Provisional counts are incomplete,
    lag varies by state, and they are not cause-specific research files from
    WONDER.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the Weekly Provisional Counts dataset page.
    - Query one jurisdiction through the Socrata JSON endpoint.
    - Keep week-ending date, jurisdiction, and all-cause deaths.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://data.cdc.gov/resource/muzy-jte6.json",
          params={
              "$where": "jurisdiction_of_occurrence='California'",
              "$limit": 52,
              "$order": "week_ending_date DESC",
          },
          timeout=30,
      )
      response.raise_for_status()
      deaths = pd.DataFrame(response.json())
      deaths["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(deaths.head())
  first_project:
    title: Chart California Weekly Deaths
    goal: Test whether provisional counts can power a bounded mortality sparkline.
    steps:
      - Convert week-ending dates and all-cause counts to usable types.
      - Plot the latest year of weekly deaths and note weeks that may still be incomplete.
      - Explain that provisional NCHS counts lag and are not the final vital-statistics file.
