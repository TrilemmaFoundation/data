id: adult-income
name: Adult Income
description: >
  Census-derived demographic and employment records for predicting whether
  annual income exceeds $50,000, with useful lessons in fairness and missing data.

url: https://archive.ics.uci.edu/dataset/2/adult
access_type:
  - download
  - api
api_key_required: false
free_to_access: true

size_gb_min: 0.001
size_gb_max: 0.01
formats:
  - CSV
  - API
license: CC BY 4.0
license_url: https://creativecommons.org/licenses/by/4.0/

domains:
  - Economics
  - Demography
data_types:
  - Tabular
tasks:
  - Classification
  - Fairness Analysis
difficulty: intermediate
geography:
  - United States
temporal_coverage: "1994"
update_frequency: static
provider: UCI Machine Learning Repository
source_type: academic
last_verified: 2026-08-10

getting_started:
  overview: >
    Adult introduces mixed numeric and categorical features, missing values,
    class imbalance, and the ethical limits of models built from demographic data.
  prerequisites:
    - Python 3.10 or newer
    - Familiarity with categorical variables and train-test splits
  access_steps:
    - Open the official UCI page and read the variable descriptions and provenance.
    - Install ucimlrepo, then run the example to fetch dataset ID 2.
  python:
    packages:
      - ucimlrepo
      - pandas
    code: |
      from ucimlrepo import fetch_ucirepo

      adult = fetch_ucirepo(id=2)
      data = adult.data.original
      print(data.head())
      print(adult.data.targets.value_counts())
  first_project:
    title: Audit an income classifier
    goal: Build a baseline classifier and examine whether its errors differ across groups.
    steps:
      - Identify missing values and encode numeric and categorical columns separately.
      - Train a simple classifier and report precision, recall, and a confusion matrix.
      - Compare error rates across one demographic field and document important limitations.
