getting_started:
  overview: >
    The Orange Book lists FDA-approved products with therapeutic-equivalence
    codes, patents, and exclusivity. Start with products.txt from the published
    zip. Exclusivity dates are not a guaranteed generic-entry day, and omitted
    patents can still block substitution.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the Orange Book data-files page and the federal public-data copyright page.
    - Download the published zip and read products.txt with the documented tilde delimiter.
    - Keep application number, trade name, and therapeutic-equivalence code.
  python:
    packages:
      - pandas
      - requests
    code: |
      import io
      import zipfile

      import pandas as pd
      import requests

      response = requests.get(
          "https://www.fda.gov/media/76860/download",
          timeout=30,
      )
      response.raise_for_status()
      with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
          products = pd.read_csv(archive.open("products.txt"), sep="~")
      sample = products[products["Trade_Name"].str.upper() == "LIPITOR"]
      print(sample[["Appl_No", "Trade_Name", "Ingredient", "TE_Code", "Approval_Date"]].head())
  first_project:
    title: Inspect One Brand's Approved Products and Exclusivity
    goal: Test whether Orange Book fields can support a bounded generic-entry review.
    steps:
      - Keep application number, trade name, ingredient, and TE code for Lipitor.
      - Join patent.txt or exclusivity.txt on application number only when those dates are present.
      - Explain that remaining patents, litigation, and supply can move generic entry after an exclusivity date.
