getting_started:
  overview: >
    IBTrACS merges tropical-cyclone best tracks from WMO regional centers into
    one archive. Start with the North Atlantic basin CSV rather than the global
    file. Intensity metrics and storm identifiers are not interchangeable
    across basins or agencies.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the IBTrACS product page and choose the North Atlantic CSV.
    - Read the column documentation, including the units row under the header.
    - Load a bounded number of rows and keep agency-specific wind fields separate.
  python:
    packages:
      - pandas
    code: |
      import pandas as pd

      url = (
          "https://www.ncei.noaa.gov/data/"
          "international-best-track-archive-for-climate-stewardship-ibtracs/"
          "v04r01/access/csv/ibtracs.NA.list.v04r01.csv"
      )
      storms = pd.read_csv(url, skiprows=[1], nrows=5000, low_memory=False)
      storms["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(storms[["SID", "NAME", "ISO_TIME", "LAT", "LON", "USA_WIND"]].head(20))
  first_project:
    title: Map recent North Atlantic storm tracks
    goal: Plot a bounded sample of North Atlantic best-track points and identify the named storms included.
    steps:
      - Skip the units row, load a bounded CSV sample, and confirm storm ID, time, and lat/lon parsed.
      - Map unique storm IDs and summarize the strongest USA_WIND values in the sample.
      - Explain that IBTrACS merges multiple agencies and that wind and pressure metrics are not directly comparable across basins.
