getting_started:
  overview: >
    Wikidata SPARQL returns CC0 statements for entities and properties. Start
    with one class, one country, and a LIMIT. Send a descriptive User-Agent.
    Query results can be incomplete, contested, or delayed relative to the
    source that a statement cites.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the Query Service and read the CC0 licensing page.
    - Write a bounded SPARQL query with a LIMIT instead of selecting the whole graph.
    - Request JSON results with a descriptive User-Agent.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      query = """
      SELECT ?item ?itemLabel WHERE {
        ?item wdt:P31 wd:Q515.
        ?item wdt:P17 wd:Q30.
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      }
      LIMIT 10
      """
      response = requests.get(
          "https://query.wikidata.org/sparql",
          params={"query": query, "format": "json"},
          headers={
              "User-Agent": (
                  "TrilemmaDataCatalogExample/1.0 "
                  "(https://data.trilemma.foundation)"
              ),
              "Accept": "application/sparql-results+json",
          },
          timeout=30,
      )
      response.raise_for_status()
      bindings = response.json()["results"]["bindings"]
      cities = pd.json_normalize(bindings)
      print(cities.head())
  first_project:
    title: List a handful of U.S. cities from Wikidata
    goal: Test whether a bounded SPARQL query can seed a reference lookup table.
    steps:
      - Keep item IRI and English label for ten cities.
      - Record missing labels instead of guessing names from other sources.
      - Treat results as CC0 statements that still need a cited source before publication.
