getting_started:
  overview: >
    Open Food Facts publishes packaged-product facts, including Nutri-Score
    and ingredient lists, under ODbL. Start with one barcode and a custom
    User-Agent. Contributor data can be incomplete, images have a separate
    share-alike licence, and the database is not medical advice.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the terms of use, including attribution and share-alike for derivative databases.
    - Request one product by barcode with a descriptive User-Agent.
    - Keep the barcode, product name, and Nutri-Score if present.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://world.openfoodfacts.org/api/v2/product/737628064502.json",
          headers={
              "User-Agent": (
                  "TrilemmaDataCatalogExample/1.0 "
                  "(https://data.trilemma.foundation)"
              )
          },
          timeout=30,
      )
      response.raise_for_status()
      product = pd.json_normalize(response.json()["product"])
      print(product.filter(regex="code|product_name|nutriscore|brands").head())
  first_project:
    title: Look up one packaged food by barcode
    goal: Test whether Open Food Facts can power a bounded product-fact card.
    steps:
      - Keep barcode, product name, brands, and Nutri-Score.
      - Record missing nutrition or ingredient fields instead of filling them from other sites.
      - Attribute Open Food Facts under ODbL and note that images and third-party packaging rights are separate.
