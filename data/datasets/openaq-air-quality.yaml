getting_started:
  overview: >
    OpenAQ aggregates publicly available air-quality monitors into one API.
    Start with a handful of locations in one country. U.S. products should
    start from AirNow; OpenAQ is a multi-country access layer, coverage is
    incomplete, and callers must follow each upstream source license.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An OpenAQ API key saved in the OPENAQ_API_KEY environment variable
  access_steps:
    - Register for a free OpenAQ API key and save it in the OPENAQ_API_KEY environment variable.
    - Read the Terms of Use, including upstream source-license and attribution rules.
    - Request a bounded page of locations for one ISO country code.
  python:
    packages:
      - pandas
      - requests
    code: |
      import os
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.openaq.org/v3/locations",
          headers={"X-API-Key": os.environ["OPENAQ_API_KEY"]},
          params={"iso": "IN", "limit": 5, "page": 1},
          timeout=30,
      )
      response.raise_for_status()
      locations = pd.json_normalize(response.json()["results"])
      locations["retrieved_at_utc"] = pd.Timestamp.now(tz="UTC")
      print(locations.head(20))
  first_project:
    title: List recent monitors in one country
    goal: Test whether OpenAQ locations can power a bounded non-U.S. air-quality lookup.
    steps:
      - Keep location id, name, coordinates, and any license or provider fields from the page.
      - Choose one location and note whether it is a government monitor or a sensor.
      - Explain that U.S. products should use AirNow, that coverage is incomplete, and that source licenses still apply.
