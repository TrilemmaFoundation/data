getting_started:
  overview: >
    The World Economic Outlook provides comparable historical estimates and
    projections for countries and groups. Start with real GDP growth, three
    countries, and a short period. Projected years are not observations, and
    releases revise both forecasts and historical estimates.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Check the current WEO release date and indicator definition.
    - Request one indicator for three countries and a bounded year range.
    - Label historical and projected periods and retain the release name with the data.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH/USA/DEU/JPN",
          timeout=30,
      )
      response.raise_for_status()
      values = response.json()["values"]["NGDP_RPCH"]
      growth = pd.DataFrame(values).sort_index()
      print(growth.tail(10))
  first_project:
    title: Compare three country growth outlooks
    goal: Compare recent and projected real GDP growth for the United States, Germany, and Japan.
    steps:
      - Record the WEO release and retrieve only the real GDP growth indicator for three countries.
      - Mark which years are estimates or projections before comparing paths.
      - Explain how forecast uncertainty, revisions, missing values, and country definitions limit conclusions.
