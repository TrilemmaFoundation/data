getting_started:
  overview: >
    The Census Population Estimates Program publishes a versioned county CSV.
    Start with five rows from the Vintage 2025 all-data file and retain the
    year and county FIPS components. Estimates can be revised in later vintages
    and do not measure the population of a neighborhood or tract.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the official Vintage 2025 county data page and citation guidance.
    - Download the county totals CSV and inspect its FIPS and population columns.
    - Keep the vintage fixed when comparing or ranking counties.
  python:
    packages:
      - requests
    code: |
      import csv
      import io
      import itertools
      import requests

      response = requests.get(
          "https://www2.census.gov/programs-surveys/popest/datasets/"
          "2020-2025/counties/totals/co-est2025-alldata.csv", timeout=30,
      )
      response.raise_for_status()
      rows = csv.DictReader(io.StringIO(response.text))
      for row in itertools.islice((row for row in rows if row["COUNTY"] != "000"), 5):
          print(row["STATE"], row["COUNTY"], row["CTYNAME"], row["POPESTIMATE2025"])
  first_project:
    title: Inspect Five County Estimates
    goal: Test a fixed-vintage population floor for a county comparison tool.
    steps:
      - Join state and county FIPS components without dropping leading zeroes.
      - Count which sampled counties exceed a chosen population threshold.
      - Explain why later estimates may differ from this pinned vintage.
