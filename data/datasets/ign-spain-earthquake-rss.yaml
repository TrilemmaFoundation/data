getting_started:
  overview: >
    IGN lists a public earthquake RSS feed in its own RSS directory. Fetch one
    feed and inspect a few items; RSS headlines are regional event context, not
    a complete alert lifecycle or proof that a destination is safe.
  prerequisites: [Python 3.10 or newer, An internet connection, The requests Python package]
  access_steps:
    - Read IGN's RSS directory and public-sector reuse terms.
    - Fetch the earthquake RSS feed once.
    - Preserve each event's link, publication time, and any location metadata.
  python:
    packages: [requests]
    code: |
      import xml.etree.ElementTree as ET
      import requests

      response = requests.get(
          "https://www.ign.es/ign/RssTools/sismologia.xml", timeout=20,
      )
      response.raise_for_status()
      root = ET.fromstring(response.content)
      for item in root.findall("./channel/item")[:3]:
          print(item.findtext("title"), item.findtext("pubDate"),
                item.findtext("link"))
  first_project:
    title: Review Recent Spanish Earthquakes
    goal: Show a few dated IGN earthquake notices with source links.
    steps:
      - Fetch and parse the official RSS feed.
      - Show the publication time and original IGN event link.
      - Explain why a headline feed does not establish local warning coverage.
