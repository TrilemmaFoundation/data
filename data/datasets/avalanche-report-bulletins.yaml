  European regional avalanche bulletins published as CAAML JSON for building a dated mountain hazard view.
theme: Environment & Hazards
url: https://static.avalanche.report/eaws_bulletins/2026-01-31/2026-01-31-AT-02.json
access_type: [download]
api_key_required: false
free_to_access: true
size_gb_min: 0
size_gb_max: 0.001
formats: [JSON]
