getting_started:
  overview: >
    The free Open-Meteo weather endpoint permits noncommercial use only; commercial
    services need separate paid access. Start with one point and one forecast day.
    Model output is not a local observation or official weather warning.
  prerequisites:
    - Python 3.10 or newer
    - An internet connection
    - The requests Python package
  access_steps:
    - Read the free API noncommercial terms and attribution requirements.
    - Choose one coordinate and limit the forecast to one day.
    - Compare the hourly timestamps with the location's time zone before display.
  python:
    packages:
      - requests
    code: |
      import requests

      response = requests.get(
          "https://api.open-meteo.com/v1/forecast",
          params={"latitude": 52.52, "longitude": 13.41,
                  "hourly": "temperature_2m", "forecast_days": 1},
          timeout=30,
      )
      response.raise_for_status()
      hourly = response.json()["hourly"]
      print(list(zip(hourly["time"], hourly["temperature_2m"]))[:5])
  first_project:
    title: Inspect a One-Day Weather Forecast
    goal: Check whether hourly temperatures support a noncommercial local conditions card.
    steps:
      - Keep the returned units and forecast timestamps with each value.
      - Display five hourly temperatures for the selected point.
      - Explain the noncommercial API limit and why a forecast is not an official warning.
