getting_started:
  overview: >
    Start with the current closure records from one bounded API page. Locations
    are tied to street segments and may not show the exact work site, while the
    separate weekday feeds refresh more often than this daily extract.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Open the official dataset page and review the location and feed-refresh notes.
    - Query a bounded page through the OpenDataSoft API.
    - Keep project, street, location, completion date, source link, and geometry.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      url = "https://opendata.vancouver.ca/api/explore/v2.1/catalog/datasets/road-ahead-current-road-closures/records"
      response = requests.get(url, params={"limit": 100}, timeout=30)
      response.raise_for_status()
      closures = pd.DataFrame(response.json()["results"])
      columns = ["project", "street", "location", "comp_date", "url_link"]
      print(closures[columns].head())
      print(closures["geom"].iloc[0]["geometry"]["type"])
  first_project:
    title: Map Current Road Closures
    goal: Test whether the daily extract can add road-work context to a local mobility map.
    steps:
      - Plot current line geometries and label each project and completion date.
      - Flag closures whose completion date has passed at retrieval time.
      - Explain why segment-level locations and different extract refresh rates limit routing decisions.
