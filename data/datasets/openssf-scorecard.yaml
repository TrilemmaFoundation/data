getting_started:
  overview: >
    OpenSSF Scorecard publishes precomputed checks for public GitHub projects.
    Start with one well-known repository and read the aggregate score plus a
    few high-risk checks. Scores describe repository practices, not whether a
    specific package version is vulnerable.
  prerequisites:
    - Python 3.10 or newer
    - A notebook environment such as Jupyter or Google Colab
    - An internet connection
  access_steps:
    - Read the Scorecard project page and the CDLA Permissive 2.0 data licence.
    - Request the published score for github.com/ossf/scorecard.
    - Keep the date, aggregate score, and check names before comparing projects.
  python:
    packages:
      - pandas
      - requests
    code: |
      import pandas as pd
      import requests

      response = requests.get(
          "https://api.scorecard.dev/projects/github.com/ossf/scorecard",
          timeout=30,
      )
      response.raise_for_status()
      payload = response.json()
      checks = pd.json_normalize(payload.get("checks", []))
      checks["repo"] = payload.get("repo", {}).get("name")
      checks["score"] = payload.get("score")
      print(payload.get("repo"), payload.get("score"))
      print(checks[["name", "score", "reason"]].head(10))
  first_project:
    title: Review one repository's Scorecard checks
    goal: Decide whether Scorecard can support an accept-or-review rule for a new dependency.
    steps:
      - Store the aggregate score and the Dangerous-Workflow, Branch-Protection, and Maintained checks.
      - Flag any check scored below 5 and record the published reason text.
      - State that Scorecard does not replace CVE monitoring or a review of the exact package version you would install.
